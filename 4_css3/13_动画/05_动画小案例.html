<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动画小案例</title>
    <style>
        div{
            width: 130px;
            height: 130px;
            background-image: url('./bike.png');
            margin: 0 auto;
            margin-top: 100px;
            /* 用一个固定大小的窗口，不断切换背景图位置，再配合 steps 做逐帧播放。 */
            animation: bike 1s steps(31) infinite;
        }
        @keyframes bike{
            from{

            }
            to{
                /* 背景图向上移动4030px */
                background-position: 0px -4030px;
            }
        }
    </style>    
</head>

<body>
    <div></div>
</body>
</html>
