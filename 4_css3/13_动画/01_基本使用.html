<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer{
            width: 1000px;
            height: 100px;
            border: 1px solid black;
        }
        .inner{
            width: 100px;
            height: 100px;
            background-color: deepskyblue;
            /* 应用动画到元素 */
            animation-name: turn-to-right2;
            /* 动画的持续时间 */
            animation-duration: 3s;
            animation-delay: 0.2s;
        }
        /* 定义一个动画 定义一组关键帧  */
        @keyframes turn-to-right{
            /* 第一帧 */
            from{
                
            }
            /* 最后一帧 */
            to{
                transform: translate(900px);
                background-color: red;
            }
        }
        /* 定义一个动画 定义一组关键帧  */
        @keyframes turn-to-right2{
            /* 第一帧 */
            0%{
                
            }
            /* 50%{
                background-color: aqua;
            } */
            /* 最后一帧 */
            100%{
                transform: translate(900px) rotate(360deg);
                background-color: purple;
                border-radius: 50%;
            }
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner"></div>
    </div>
</body>
</html>
