<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer{
            width: 200px;
            height: 200px;
            border: 2px solid black;
            margin: 0 auto;
            margin-top: 100px;    
        }
        .inner{
            width: 200px;
            height: 200px;
            background-color: deepskyblue;
            /* 通过关键词调整变换原点 */
            /* transform-origin: left top; */
            /* 通过具体像素值调整变换原点 */
            /* transform-origin: 50px 50px; */
            /* 通过具体百分比调整变换原点 */
            /* transform-origin: 25% 25%; */
            /* 没说的话，y轴默认取50% */
            transform-origin: left;
            transform: scale(0.1);
            /* 变换原点位置对 旋转 缩放 有影响 */
            /* 变换原点位置对 位移 没有影响 */
        }
        .test{
            width: 50px;
            height: 50px;
            background-color: orange;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">
            <div class="test">
                你好啊
            </div>
        </div>
    </div>  
</body>
</html>
