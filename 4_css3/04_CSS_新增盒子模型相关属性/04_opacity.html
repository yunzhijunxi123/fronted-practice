<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            width: 200px;
            height: 200px;
            background-color: orange;
            font-size: 40px;
            font-weight: bold;
            opacity: 1;
        }
        .box2{
             position: relative;
             width: 400px;
        }
        h1{
            position: absolute;
            top: 0;
            left: 0;
            background-color: black;
            color: white;
            line-height: 100px;
            width: 100%;
            text-align: center;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="box1">你好啊</div>
    <div class="box2">
        <img src="./你瞅啥.jpg" alt="">
        <h1>你瞅啥</h1>
    </div>
</body>
</html>
