<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 300px;
            height: 200px;
            border: 1px solid black;
            font-size: 20px;
            float: left;
            margin-left: 50px;
        }
        /* 最中间红色 */
        .box1{
            background-image: radial-gradient(red,yellow,green);
        }
        /* at left top 圆心在左上角 */
        .box2{
            background-image: radial-gradient(at left top,red,yellow,green);
        }
        .box3{
            background-image: radial-gradient(at 100px 50px,red,yellow,green);
        }
        .box4{
            background-image: radial-gradient(circle,red,yellow,green);
        }
        .box5{
            background-image: radial-gradient(100px 100px,red,yellow,green);
        }
        /* 100为50+50 */
        .box6{
            background-image: radial-gradient(red 50px,yellow 100px,green 150px);
        }
        /* 两个半径 圆心位置 颜色配置 */
        .box7{
            background-image: radial-gradient(100px 50px at 150px 150px,red 50px,yellow 100px,green 150px);
        }
    </style>
</head>
<body>
    <div class="box box1">默认情况 中心到外围</div>
    <div class="box box2">关键词调整圆心</div>
    <div class="box box3">像素值调整圆心</div>
    <div class="box box4">circle关键字调整为正圆</div>
    <div class="box box5">像素值调整为正圆</div>
    <div class="box box6">调整径向渐变区域</div>
    <div class="box box7">综合写法</div>
</body>
</html>
