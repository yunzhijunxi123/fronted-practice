<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>过渡的高级效果</title>
    <style>
        .outer{
            width: 1000px;
            height: 900px;
            border: 1px solid black;
        }
        .outer:hover .box{
            width: 1000px;
        }
        .box{
            width: 200px;
            height: 100px;
            transition: all;
            transition-duration: 5s;
            /* 过渡延迟 */
            /* transition-delay: 2s; */

        }

        .box1{
            background-color: skyblue;
            transition-timing-function: ease;
        }
        .box2{
            background-color: orange;
            transition-timing-function: linear;
        }
        .box3{
            background-color: red;
            transition-timing-function: ease-in;
        }
        .box4{
            background-color: green;
            transition-timing-function: ease-out;
        }
        .box5{
            background-color: purple;
            transition-timing-function: ease-in-out;
        }
        .box6{
            background-color: pink;
            transition-timing-function: step-start;
        }
        .box7{
            background-color: chocolate;
            transition-timing-function: step-end;
        }
        .box8{
            background-color: blue;
            transition-timing-function: steps(20,end);
        }
        .box9{
            background-color: gray;
            transition-timing-function: cubic-bezier(1,1.35,1,1.19);
        }

    </style>
</head>
<body>
    <div class="outer">
        <div class="box box1">ease 慢 快 慢</div>
        <div class="box box2">linear 匀速</div>
        <div class="box box3">ease-in 慢 快</div>
        <div class="box box4">ease-out 快 慢</div>
        <div class="box box5">ease-in-out 慢 快 慢</div>
        <div class="box box6">step-start 不考虑过渡时间，直接就是终点</div>
        <div class="box box7">step-end过渡时间到了之后，直接到终点</div>
        <div class="box box8">steps分步过渡</div>
        <div class="box box9">贝塞尔曲线，有弹性</div>

    </div>
</body>
</html>
