<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box1{
            height: 200px;
            width: 200px;
            background-color: skyblue;
        }
        /* vw */
        /* 宽度 视口宽度的百分之50 */
        /* 高度 视口宽度的百分之20 */
        .box2{
            width: 50vw;
            height: 20vw;
            background-color: green;
        }
        /* vh */
        /* 宽度 视口高度的百分之50 */
        /* 高度 视口高度的百分之20 */
        .box3{
            width: 50vh;
            height: 20vh;
            background-color: orange;
        }
        /* vmax视口宽度与视口高度的最大值 */

    </style>
</head>
<body>
    <div class="box1">像素</div>
    <div class="box2">vw</div>
    <div class="box3">vh</div>
</body>
</html>
