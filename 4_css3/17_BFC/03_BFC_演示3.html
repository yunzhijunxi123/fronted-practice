<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
          .outer{
               width: 400px;
               background-color: #888;
               float: left;
               /* 1 浮动元素 */
               /* float: left; */
               /* 2 绝对定位、固定定位的元素 */
               /* position: absolute; */
               /* 3 行内块元素 */
               /* display: inline-block; */
               /* 4 表格 */
               /* display: table; */
               /* 5 overflow的值不为visible的块元素 */
               /* overflow: hidden; */
               /* 7 多列容器 */
               /* column-count: 1; */
               /* 8 */
               display: flow-root;
          }
          .inner{
               width: 100px;
               height: 100px;
               float: left;
          }
          .inner1{
               background-color: orange;
          }
          .inner2{
               background-color: green;
          }
    </style>
</head>
<body>
     <div class="outer">
          <div class="inner inner1"></div>
          <div class="inner inner2"></div>
     </div>
</body>
</html>
