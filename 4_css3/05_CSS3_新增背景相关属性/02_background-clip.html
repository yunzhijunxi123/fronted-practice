<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            width: 400px;
            height: 400px;
            background-color: skyblue;
            margin: 0 auto;
            padding: 50px;
            border: 50px dashed rgba(255, 0, 0, 0.7);
            font-size: 120px;
            font-weight: bold;
            color: transparent;
            background-image: url('../images/bg02.jpg');
            /* 背景图片不重复 */
            background-repeat: no-repeat;
            /* 背景图片的顶点位置,border-box,padding-box,content-box */
            background-origin: padding-box;
            /* 超出border以外的不可见 */
            /* background-clip: border-box; */
            /* 超出padding以外的不可见 */
            /* 无论背景颜色还是背景图片，均受background-clip指挥 */
            /* 背景图只呈现在文字上 */
            background-clip: text;
        }
    </style>
</head>
<body>
    <div class="box1">
        你好啊
    </div>
</body>
</html>
