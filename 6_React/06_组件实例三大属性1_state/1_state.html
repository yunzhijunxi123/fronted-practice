<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="test"></div>
    <!-- 引入react核心库 -->
    <script type="text/javascript" src="../js/react.development.js"></script>
    <!-- 引入react-dom 用于支持react操作DOM -->
    <script
      type="text/javascript"
      src="../js/react-dom.development.js"
    ></script>
    <!-- 引入babel 用于将jsx转为js -->
    <script type="text/javascript" src="../js/babel.min.js"></script>

    <script type="text/babel">
        //1.创建组件
        class Weather extends React.Component{    
            //构造器调用几次
            constructor(props){
                console.log("constructor");
                super(props)
                //初始化状态
                this.state = {isHot:false,wind:'微风'}
                //解决changeWeather中指向问题
                this.demo = this.changeWeather.bind(this)//bind改变this指向
            }
            
            //render调用几次 1+n 1是初始化那次 n是状态更新的次数
            render(){
                console.log("render");
                //读取状态
                //console.log(this);//输出的是组件的实例对象
                const {isHot,wind} = this.state
                //下面的this.changeWeather为实例自身的 this被牢牢绑定的新函数
                return <h1 onClick={this.demo}>今天天气很{isHot?'炎热':'凉爽'},{wind}</h1>
            }
            
            //changeWeather调用几次 鼠标点击几次调用几次
            changeWeather(){
            //changeWeather放在哪里 ——Weather原型对象上 供实例使用
            //由于changeWeather作为onClick的回调 不是通过实例调用的 是直接调用      
            //类中的方法默认开启局部严格模式 changeWeather中的this为undefined
                const isHot = this.state.isHot
                //状态通过setState进行更新 更新是一种合并 不是替换
                this.setState({isHot:!isHot})
                //注意 状态(state) 不可直接更改 下面这行就是直接更改！
                //this.state.isHot = !isHot错误
                //console.log(this.state.isHot); 
            }
        }
        /*2.渲染组件到页面*/
        ReactDOM.render(<Weather/>,document.getElementById('test'))

    </script>
</body> 
</html>
