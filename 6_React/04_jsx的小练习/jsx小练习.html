<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="test"></div>
    <!-- 引入react核心库 -->
    <script type="text/javascript" src="../js/react.development.js"></script>
    <!-- 引入react-dom 用于支持react操作DOM -->
    <script
      type="text/javascript"
      src="../js/react-dom.development.js"
    ></script>
    <!-- 引入babel 用于将jsx转为js -->
    <script type="text/javascript" src="../js/babel.min.js"></script>
    <script type="text/babel">
        const a = 1
        /*
            注意区分 js语句（代码）与 js表达式
                1.表达式：一个表达式产生一个值 放在任何一个需要值的地方
                    以下都是表达式
                    demo(1)即函数调用表达式 没写返回值 也return undefined
                    map方法遍历原数组的每个元素 执行指定操作后返回一个新数组，原数组不变
                    (1)a (2) a+b (3) demo(1) (4) arr.map()
                    (5)function test()
                2.语句(代码)
                    (1)if{} (2)for(){} (3)switch(){case:XXXX}

        */

        //模拟数据
        const data= ['Angular','React','Vue']//给React数组可遍历 给对象就不行
        const data2 =[<li>Angular</li>,<li>React</li>,<li>Vue</li>]
        const obj = {name1:'Angular',name2:'React',name3:'Vue'}
        //1.创建虚拟DOM
        const VDOM =(
            <div>
                <h1>前端JS框架列表</h1>
                <ul>
                    {
                        data.map((item,index)=>{
                            return <li key={index}>{item}</li>
                        })
                    }
                </ul>
            </div>
        )
        //2.渲染虚拟DOM到页面
        ReactDOM.render(VDOM,document.getElementById('test'))
    </script>
</body>
</html>
