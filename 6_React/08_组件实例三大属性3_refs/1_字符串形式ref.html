<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="test1"></div>
    <div id="test2"></div>
    <div id="test3"></div>
    <!-- 引入react核心库 全局多了React-->
    <script type="text/javascript" src="../js/react.development.js"></script>
    <!-- 引入react-dom 用于支持react操作DOM  全局多了ReactDOM-->
    <script
      type="text/javascript"
      src="../js/react-dom.development.js"
    ></script>
    <!-- 引入babel 用于将jsx转为js -->
    <script type="text/javascript" src="../js/babel.min.js"></script>
    <!-- 引入prop-types 用于对组件标签属性进行限制 全局多了PropTypes-->
    <script type="text/javascript" src="../js/prop-types.js"></script>

    <script type="text/babel">
      class Demo extends React.Component {
        showData=()=>{
            //console.log(this.refs.input1);
            const {input1} =this.refs//解构赋值
            alert(input1.value)
        }
        showData2=()=>{
            //console.log(this.refs.input1);
            const {input2} =this.refs//解构赋值
            alert(input2.value)
        }
        render() {
          return (
            <div>
              <input ref="input1" type="text" placeholder="点击按钮提示数据" />
              &nbsp;
              <button ref="button1" onClick={this.showData}>点我提示左侧数据</button>&nbsp;
              <input onBlur={this.showData2} ref="input2" type="text" placeholder="失去焦点提示数据" />
              &nbsp;
            </div>
          );
        }
      }
      ReactDOM.render(<Demo a="1" b="2"/>, document.getElementById("test1"));
    </script>
  </body>
</html>
