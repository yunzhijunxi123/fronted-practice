<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="test1"></div>
    <div id="test2"></div>
    <div id="test3"></div>
    <!-- 引入react核心库 全局多了React-->
    <script type="text/javascript" src="../js/react.development.js"></script>
    <!-- 引入react-dom 用于支持react操作DOM  全局多了ReactDOM-->
    <script
      type="text/javascript"
      src="../js/react-dom.development.js"
    ></script>
    <!-- 引入babel 用于将jsx转为js -->
    <script type="text/javascript" src="../js/babel.min.js"></script>
    <!-- 引入prop-types 用于对组件标签属性进行限制 全局多了PropTypes-->
    <script type="text/javascript" src="../js/prop-types.js"></script>

    <script type="text/babel">
      class Demo extends React.Component {
        state = {isHot:true}
        /*
          29行将input这个DOM节点赋值给this.input1
        */
        showInfo = ()=>{
          const {input1} = this
          alert(input1.value)
        }
        changeWeather = ()=>{
          const isHot = this.state.isHot
          this.setState({isHot:!isHot}) 
        }
        saveInput = (c)=>{
          this.input1 = c;
          console.log('@',c);
        }
        render(){
          const {isHot} = this.state
          return(
            <div>
              <h2 onClick={this.changeWeather}>今天天气很{isHot?"炎热":"凉爽"}</h2>
              {/*<input ref={(c)=>{this.input1 = c;console.log('@',currentNode);}} type="text"/>*/}
              <input ref={this.saveInput} type="text"/><br/><br/>
              <button onClick={this.showInfo}>点我提示输入的数据</button>
              <button onClick={this.changeWeather}>点我切换天气</button>
            </div>
          )
        }
      }
      ReactDOM.render(<Demo/>, document.getElementById("test1"));
    </script>
  </body>
</html>
