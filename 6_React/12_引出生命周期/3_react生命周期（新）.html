<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="test1"></div>
    <!-- 引入react核心库 全局多了React-->
    <script type="text/javascript" src="../js/17.0.1/react.development.js"></script>
    <!-- 引入react-dom 用于支持react操作DOM  全局多了ReactDOM-->
    <script
      type="text/javascript"
      src="../js/17.0.1/react-dom.development.js"
    ></script>
    <!-- 引入babel 用于将jsx转为js -->
    <script type="text/javascript" src="../js/17.0.1/babel.min.js"></script>
    <!-- 引入prop-types 用于对组件标签属性进行限制 全局多了PropTypes-->
    <script type="text/javascript" src="../js/17.0.1/prop-types.js"></script>

    <script type="text/babel">
      class Count extends React.Component {
        /*
          1. 初始化阶段: 由ReactDOM.render()触发---初次渲染
              1.constructor()
              2.getDerivedStateFromProps 
              3.render()
              4.componentDidMount()
          2. 更新阶段: 由组件内部this.setSate()或父组件重新render触发
              1.getDerivedStateFromProps
              2.shouldComponentUpdate()
              3.render()
              4.getSnapshotBeforeUpdate
              5.componentDidUpdate()
	        3. 卸载组件: 由ReactDOM.unmountComponentAtNode()触发
        */
        constructor(props) {
          console.log("Count---constructor");
          super(props);
          //初始化状态
          this.state = { count: 0 };
        }
        //加1按钮的回调
        add = () => {
          //获取原状态
          const { count } = this.state;
          //更新状态
          this.setState({ count: count + 1 });
        };
        //强制更新按钮的回调
        force = () => {
          this.forceUpdate();
        };
        death = () => {
          ReactDOM.unmountComponentAtNode(document.getElementById("test1"));
        };
        //若state的值任何时候都取决于props 可以使用
        static getDerivedStateFromProps(props,state){//从props得到派生的状态 
          console.log("getDerivedStateFromProps",props,state);
          return null;//返回状态对象
        }
        //在更新前 来个快照
        getSnapshotBeforeUpdate(){
          console.log("getSnapshotBeforeUpdate");
          return 'atguigu';
        }
        //判断组件是否应该更新的阀门 默认true
        shouldComponentUpdate() {
          console.log("Count---shouldComponentUpdate");
          return true;
        }
        //组件挂载完毕的钩子
        componentDidMount() {
          console.log("Count---ComponentDidMount");
        }
        //组件将要卸载的钩子
        componentWillUnmount() {
          console.log("Count---ComponentWillUnmount");
        }


        //组件更新完毕的钩子
        componentDidUpdate(preProps,preState,snapshotValue) {
          console.log("Count---ComponentDidUpdate",preProps,preState,snapshotValue);
        }
        render() {
          console.log("Count---render");
          const { count } = this.state;
          return (
            <div>
              <h2>当前求和为{count}</h2>
              <button onClick={this.add}>点我+1</button>
              <button onClick={this.death}>卸载组件</button>
              <button onClick={this.force}>
                不更改任何state的数据 强制更新
              </button>
            </div>
          );
        }
      }

      ReactDOM.render(<Count count={199}/>, document.getElementById("test1"));
    </script>
  </body>
</html>
