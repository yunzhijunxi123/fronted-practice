<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="test1"></div>
    <!-- 引入react核心库 全局多了React-->
    <script type="text/javascript" src="../js/react.development.js"></script>
    <!-- 引入react-dom 用于支持react操作DOM  全局多了ReactDOM-->
    <script
      type="text/javascript"
      src="../js/react-dom.development.js"
    ></script>
    <!-- 引入babel 用于将jsx转为js -->
    <script type="text/javascript" src="../js/babel.min.js"></script>
    <!-- 引入prop-types 用于对组件标签属性进行限制 全局多了PropTypes-->
    <script type="text/javascript" src="../js/prop-types.js"></script>

    <script type="text/babel">
      /*
        	1. 初始化阶段: 由ReactDOM.render()触发---初次渲染
            1.constructor()
            2.componentWillMount()
            3.render()
            4.componentDidMount()常用
              组件挂载完毕 做初始化的事 开启定时器 发送网络请求 订阅信息
          2. 更新阶段: 由组件内部this.setSate()或父组件重新render触发
            1.shouldComponentUpdate()
            2.componentWillUpdate()
            3.render()必须
            4.componentDidUpdate()
          3. 卸载组件: 由ReactDOM.unmountComponentAtNode()触发
            1.componentWillUnmount()常用 
              组件将要卸载 关闭定时器 取消订阅消息
      
      */
      class Count extends React.Component {
        constructor(props) {
          console.log("Count---constructor");
          super(props);
          //初始化状态
          this.state = { count: 0 };
        }
        //加1按钮的回调
        add = () => {
          //获取原状态
          const { count } = this.state;
          //更新状态
          this.setState({ count: count + 1 });
        };
        //强制更新按钮的回调
        force = () => {
          this.forceUpdate();
        };
        death = () => {
          ReactDOM.unmountComponentAtNode(document.getElementById("test1"));
        };
        //组件将要挂载的钩子
        componentWillMount() {
          console.log("Count---ComponentWillMount");
        }
        //组件挂载完毕的钩子
        componentDidMount() {
          console.log("Count---ComponentDidMount");
        }
        //组件将要卸载的钩子
        componentWillUnmount() {
          console.log("Count---ComponentWillUnmount");
        }
        //判断组件是否应该更新的阀门 默认true
        shouldComponentUpdate() {
          console.log("Count---shouldComponentUpdate");
          return false;
        }
        //组件将要更新的钩子
        componentWillUpdate() {
          console.log("Count---ComponentWillUpdate");
        }
        //组件更新完毕的钩子
        componentDidUpdate() {
          console.log("Count---ComponentDidUpdate");
        }
        render() {
          console.log("Count---render");
          const { count } = this.state;
          return (
            <div>
              <h2>当前求和为{count}</h2>
              <button onClick={this.add}>点我+1</button>
              <button onClick={this.death}>卸载组件</button>
              <button onClick={this.force}>
                不更改任何state的数据 强制更新
              </button>
            </div>
          );
        }
      }
      //父组件A
      class A extends React.Component {
        //初始化状态
        state = { carName: "奔驰" };
        changeCar = () => {
          this.setState({ carName: "奥迪" });
        };
        render() {
          return (
            <div>
              <div>我是A组件</div>
              <button onClick={this.changeCar}>换车</button>
              {/*把state作为props传给B组件*/}
              <B carName={this.state.carName} />
            </div>
          );
        }
      }
      //子组件B
      class B extends React.Component {
        componentDidMount() {
          console.log("B---componentDidMount");
        }
        //组件将要接收新的props的钩子
        componentWillReceiveProps(props) {
          //应该是componentWillReceiveProps
          console.log("B---componentWillReceiveProps", props);
        }
        shouldComponentUpdate() {
          return true;
        }
        componentWillUpdate() {
          console.log("B---ComponentWillUpdate");
        }
        //组件更新完毕的钩子
        componentDidUpdate() {
          console.log("B---ComponentDidUpdate");
        }
        render() {
          console.log("B---render");

          return <div>我是B组件，接收到的车是：{this.props.carName}</div>;
        }
      }
      ReactDOM.render(<A />, document.getElementById("test1"));
    </script>
  </body>
</html>
