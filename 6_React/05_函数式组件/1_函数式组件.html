<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
</head>
<body>
    <div id="test"></div>
    <!-- 引入react核心库 -->
    <script type="text/javascript" src="../js/react.development.js"></script>
    <!-- 引入react-dom 用于支持react操作DOM -->
    <script
      type="text/javascript"
      src="../js/react-dom.development.js"
    ></script>
    <!-- 引入babel 用于将jsx转为js -->
    <script type="text/javascript" src="../js/babel.min.js"></script>

    <script type="text/babel">
        //1.创建函数式组件 React负责调用函数 
        function MyComponent(){//大写！！！
            console.log(this);//经过Babel翻译 变成严格模式 this不经过严格模式为Window 现在为undefined
            return <h2>我是用函数定义的组件（适用于简单组件的定义）</h2>//返回值！！！
        }
        //2.渲染组件到页面
        ReactDOM.render(<MyComponent/>,document.getElementById('test'))//组件标签！！！
        /*
                  执行了28行 ReactDOM.render(<MyComponent/>......之后 发生了什么？
                1.React解析组件标签 找到了MyComponent组件
                2.发现组件使用函数定义的 随后调用函数
                3.将返回虚拟的DOM转为真实DOM 随后呈现在页面中
        */
    </script>
</body>
</html>
