<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="test1"></div>
    <div id="test2"></div>
    <div id="test3"></div>
    <!-- 引入react核心库 全局多了React-->
    <script type="text/javascript" src="../js/react.development.js"></script>
    <!-- 引入react-dom 用于支持react操作DOM  全局多了ReactDOM-->
    <script
      type="text/javascript"
      src="../js/react-dom.development.js"
    ></script>
    <!-- 引入babel 用于将jsx转为js -->
    <script type="text/javascript" src="../js/babel.min.js"></script>
    <!-- 引入prop-types 用于对组件标签属性进行限制 全局多了PropTypes-->
    <script type="text/javascript" src="../js/prop-types.js"></script>

    <script type="text/babel">
      class Demo extends React.Component {
        /*
            1.通过onXxx属性指定事件处理函数(注意大小写)
                1)React使用的是自定义(合成)事件, 而不是使用的原生DOM事件 更好的兼容性
                2)React中的事件是通过事件委托方式处理的(委托给组件最外层的元素) 为了高效
            2.通过event.target得到发生事件的DOM元素对象 不要过度使用ref
        */
        /*
            创建Ref容器
        */
        myRef = React.createRef()
        myRef2 = React.createRef()

        showData = () => {
          alert(this.myRef.current.value);
        };
        showData2 = (event) => {
        //   alert(this.myRef2.current.value);
            alert(event.target.value)//event.target即input标签

        };
        render() {
          /*
            回调函数特点 你定义的函数 你没有调用 最终有别人调用
            this.input1 = a 把ref当前所处的节点放在组件实例自身上
          */
          return (
            <div>
              <input
                ref={this.myRef}
                type="text"
                placeholder="点击按钮提示数据"
              />
              &nbsp;

              <button ref="button1" onClick={this.showData}>
                点我提示左侧数据
              </button>
              &nbsp;

              <input
                onBlur={this.showData2}
                //ref={this.myRef2} 发生事件的元素刚好是要操作的元素
                type="text"
                placeholder="失去焦点提示数据"
              />
              
            </div>
          );
        }
      }
      ReactDOM.render(<Demo a="1" b="2" />, document.getElementById("test1"));
    </script>
  </body>
</html>
