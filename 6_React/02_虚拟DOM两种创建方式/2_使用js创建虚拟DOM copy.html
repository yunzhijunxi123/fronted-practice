<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="test"></div>

    <!-- 引入react核心库 -->
    <script type="text/javascript" src="../js/react.development.js"></script>
    <!-- 引入react-dom 用于支持react操作DOM -->
    <script
      type="text/javascript"
      src="../js/react-dom.development.js"
    ></script>

    <script type="text/javascript">
      //1.创建虚拟DOM   不要写引号 不是字符串
      const VDOM = React.createElement("h1", { id: "title" }, React.createElement('span',{},'Hello,React')); //(标签名，标签属性，标签内容)
      //2.渲染虚拟DOM的页面
      ReactDOM.render(VDOM, document.getElementById("test")); /*(虚拟DOM,容器)*/
      // ReactDOM.render(VDOM2,document.getElementById('test'))/*(虚拟DOM,容器)*/ 替换动作
    </script>
  </body>
</html>
