<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="test"></div>
    <div id="demo"></div>

    <!-- 引入react核心库 -->
    <script type="text/javascript" src="../js/react.development.js"></script>
    <!-- 引入react-dom 用于支持react操作DOM -->
    <script
      type="text/javascript"
      src="../js/react-dom.development.js"
    ></script>
    <!-- 引入babel 用于将jsx转为js -->
    <script type="text/javascript" src="../js/babel.min.js"></script>
    <script type="text/babel">
      /*一定要写babel*/
      //1.创建虚拟DOM   不要写引号 不是字符串
      //JSX是原始JS创建虚拟DOM的一种语法糖
      const VDOM = (
        <h1 id="title">
          <span>Hello,React</span>
        </h1>
      );
      const VDOM2 = <h1>Hello,atguigu</h1>;
      //2.渲染虚拟DOM的页面
      ReactDOM.render(VDOM, document.getElementById("test")); /*(虚拟DOM,容器)*/
      console.log("虚拟DOM",VDOM);
      var TDOM = document.getElementById('demo')
      console.log("真实DOM",TDOM);
      debugger;
      // console.log(typeof VDOM);
      // console.log(VDOM instanceof Object);
      /*
        DOM = 浏览器把 HTML 转成的一棵可编程的对象树。
        
        关于虚拟DOM
          1.本质是Object类型的对象（一般对象）
          2.虚拟DOM比较轻，真实DOM比较重 
          虚拟DOM是React内部在用 无需真实DOM那么多属性
          3.虚拟DOM最终会被React转化为真实DOM 呈现在页面上
      */
      
    </script>
  </body>
</html>
