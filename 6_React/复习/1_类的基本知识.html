<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
            总结
                1.类中的构造器不是必须写的，要对实例进行一些初始化的操作，添加指定属性时才写
                2.如果A类继承了B类 且A类中写了构造器，那么构造器中的super是必须要调用的
                3.类中所定义的方法，都放在类的原型对象上，供实例使用
        */
        //创建一个Person类
        class Person{
            //构造器方法
            constructor(name,age) {
                //构造器中的this指的是谁——类的实例对象
                this.name=name
                this.age=age
            }
            //一般方法
            speak(){
                //speak方法在类的原型对象上，供实例使用
                //通过Person实例调用speak时 speak中的this就是Person实例
                console.log(`我叫${this.name},我年龄是${this.age}`);
                
            }
        }
        class Student extends Person{
            constructor(name,age,grade){
                super(name,age);//super放在前面
                this.grade=grade;
                this.school = '尚硅谷'
            }
            //重写从父类继承来的方法
            speak(){
                console.log(`我叫${this.name},我年龄是${this.age},我读的是${this.grade}年级`);
                this.study()
            }
            //通过Student实例调用study时 study中的this就是Student实例
            study(){
                console.log('我很努力的学习');
            }
        }
        //创建一个Person的实例对象
        // const p1 = new Person('tom',18)//控制台显示Person{} 输出的实例对象 由Person类new出来的
        // const p2 = new Person('jerry',19)

        // console.log(p1); 
        // console.log(p2);
        // p1.speak()
        // p2.speak()
        //p1.speak().call({a:1,b:2})//call()更改函数内部的this指向
        // const s1 = new Student('小张',15,'高一')
        // console.log(s1);
        // s1.speak();
        const stu1 = new Student('tom',18,'高一')
        stu1.speak()
        class Car{
            constructor(name,price){
                this.name = name
                this.price = price
                //this.wheel = 4
            }
            //类中可以直接写赋值语句 给Car的实例对象添加一个属性 名为a 值为1
            a = 1
            wheel = 4
            static demo = 100//加了static给Car类自身加 而不是给实例加
        }
        //Car.demo = 100
        const c1 = new Car('奔驰',199)
        console.log(c1);
        console.log(Car.demo);
        
        
    </script>
</body>
</html>
