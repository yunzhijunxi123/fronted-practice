<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr = [1, 3, 5, 7, 9];
      let arr2 = [2, 4, 6, 8, 10];
      console.log(...arr); //展开一个数组
      let arr3 = [...arr, ...arr2];
      console.log(...arr3);
      function sum(a, b, c) {
        return a + b + c;
      }
      console.log(sum(1, 2, 3));
      function sum2(...numbers) {
        console.log("@", numbers);
      }
      console.log(sum2(1, 2, 3, 4));
      /*
            第一次迭代：preValue = 1（初始值，取第一个元素），currentValue = 2

            返回：1 + 2 = 3

            第二次迭代：preValue = 3（上次结果），currentValue = 3

            返回：3 + 3 = 6

            第三次迭代：preValue = 6（上次结果），currentValue = 4

            返回：6 + 4 = 10
        */
      function sum3(...numbers) {
        return numbers.reduce((preValue, currentValue) => {
          return preValue + currentValue;
        });
      }
      console.log(sum3(1, 2, 3, 4));
      let person = {name:'tom',age:18}
      let person2 = {...person}//浅拷贝
      //let person2 = person 
      //console.log(...person); //报错，展开运算符不能展开对象  
      person.name = 'jerry'
      console.log(person);
      console.log(person2);

      let person3 = {...person,name:'jack',address:'地球'}//合并动作
      console.log(person3);
      
    </script>
  </body>
</html>
