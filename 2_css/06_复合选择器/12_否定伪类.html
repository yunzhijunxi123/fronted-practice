<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 选中的是div的儿子p元素，但排除类名为fail的元素 */
        /* div>p:not(.fail){
            color: red;
        } */
        div>p:not([title^="你要加油"]){
            color: red;
        }
        /* 选中div的儿子p元素，但排除第一个儿子p元素 */
        div>p:not(:first-child){
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div>
        <p>张三：98分</p>
        <p>李四：88分</p>
        <p>王五：78分</p>
        <p>赵六：68分</p>
        <p class="fail">老七：58分</p>
        <p class="fail" title="你要加油啊">老八：48分</p>
    </div>
</body>
</html>
