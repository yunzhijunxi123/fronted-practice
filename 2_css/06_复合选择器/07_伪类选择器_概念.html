<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 伪类：元素特殊状态的一种描述 */
        /* 选中的是没有访问过的a元素 */
        a:link{
            color: orange;
            font-size: 50px;
        }
        a:visited{
            color:gray;
            font-size: 50px;
        }
    </style>
</head>
<body>
    <a href="https://www.baidu.com">去百度</a>
    <a href="https://www.jd.com">去京东</a>
</body>
</html>
