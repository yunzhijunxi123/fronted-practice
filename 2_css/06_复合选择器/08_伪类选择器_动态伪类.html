<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 伪类：元素特殊状态的一种描述 */
        /* 四个顺序不能乱 */
        /* 未访问过 */
        a:link{
            color: orange;
            font-size: 50px;
        }
        /* 访问过 */
        a:visited{
            color:gray;
            font-size: 50px;
        }
        /* 鼠标悬浮状态 */
        a:hover{
            color: skyblue;
        }
        /* 激活状态 */
        a:active{
            color: green;
        }
        span:hover{
            color:green;
            font-size: 50px;
        }
        span:active{
            color:red;
            font-size: 50px;
        }
        input:focus{
            color: orange;
            background-color: green;
        }
        select:focus{
            color: orange;
            background-color: green;
        }
    </style>
</head>
<body>
    <a href="https://www.baidu.com">去百度</a>
    <a href="https://www.jd.com">去京东</a>
    <span>尚硅谷</span>
    <br>
    <input type="text">
    <br>
    <input type="text">
    <br>
    <input type="text">
    <select>
        <option value="beijing">北京</option>
        <option value="shanghai">上海</option>
    </select>
</body>
</html>
