<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 选中页面中所有类名为say的元素 */
        .say{
            color: red;
        }
        .answer{
            color:blue;
        }
        .big{
            font-size: 60px;
        }
    </style>
</head>
<body>
    <h1>欢迎来到土味官网</h1>
    <br>
    <h2>土味情话</h2>
    <p class="say big">我对你说:万水千山总是情</p>
    <p class="say">我对你说：爱我多点行不行</p>
    <br>
    <h2>反杀土味情话</h2>
    <p class="answer">你回答我：一寸光阴一寸金</p>
    <p class="answer">你回答我：劝你死了这条心</p>
</body>
</html>
