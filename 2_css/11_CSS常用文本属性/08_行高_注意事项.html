<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 注意点1：行高过小？文字重叠，且最小值是零，不能为负数 */
        /* #d1{
            font-size: 40px;
            background-color: skyblue;

            line-height: 60px;
        } */
        /* 注意点2：行高是可以继承的*/
        /* #d2{
            font-size: 40px;
            background-color: orange;
            line-height: 1.5;
        }
        span{
            font-size: 200px;
            color: red;
        } */
         /* 注意点3：line-height与height的关系
            设置了height就是height
            没设置就是一行的高度乘以行数
          */
        #d3{
            font-size: 40px;
            background-color: yellowgreen;
            /* 一行的高度 */
            line-height: 100px;
            /* 容器的高度 */
            height: 300px;
        }
        /* 行高的应用场景1：调整多行文字的间距 */
        #d5{
            font-size: 40px;
            background-color: skyblue;
            line-height: 100px;
        }
        /* 行高的应用场景2：单行文字的垂直居中 */
        #d6{
            font-size: 40px;
            background-color: orange;
            height: 300px;
            line-height: 300px;
        }
    </style>
</head>
<body>
