<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer{
            width: 500px;
            background-color: skyblue;
            border: 1px solid black;
            padding: 20px;
            /* 子绝父相 */
            position: relative;
            z-index: 2;
        }
        .box{
            width: 200px;
            height: 200px;
        }
        .box1{
            background-color: #888;
        }
        .box2{
            background-color: orange;
            position: relative;
            top: -150px;
            left: 50px;
            
        }
        .box3{
            background-color: green;
            position: absolute;
            top: 130px;
            left: 130px;
            
        }
        .box4{
            background-color: red;
            position: fixed;
            top: 200px;
            left: 200px;
            /* 容易被包含块拖累 */
            z-index: 50;
        }
        .box5{
            background-color: purple;
            position: fixed;
            top: 260px;
            left: 260px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
    </div>
    <div class="box box5">5</div>
</body>
</html>
