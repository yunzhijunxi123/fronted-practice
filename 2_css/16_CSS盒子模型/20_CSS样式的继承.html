<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./index.css">
    <style>
        /* 背景色不能继承 */
        /* 字体属性、文本属性(除了vertical-align)、
        文本颜色会继承，能继承的都不影响布局 */
        #d1{
            height: 600px;
            padding: 50px;
            background-color: gray;

        }
        #d2{
            height: 400px;
            padding: 50px;
            background-color: orange;
            font-size: 40px;
            color: yellow;
            font-weight: bold;
        }
        #d3{
            height: 200px;
            background-color: green;
        }
    </style>
</head> 
<body>
    <div id="d1">
        <div id="d2">
            <div id="d3" style="font-family: 隶书;">你好啊</div>
        </div>
    </div>
</body>
</html>
