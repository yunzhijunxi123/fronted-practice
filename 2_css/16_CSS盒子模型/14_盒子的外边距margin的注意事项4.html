<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 800px;
            height: 100px;
            margin: right;
            background-color: deepskyblue;
        }
        span{
            background-color: purple;
        }
    </style>
</head>
<body>
    <!-- margin可以是auto，给一个块级元素左右margin设置auto -->
    <!-- 以实现该元素在父元素中水平居中 -->
    <div>你好啊</div>
    <span>我很好</span>
</body>
</html>
