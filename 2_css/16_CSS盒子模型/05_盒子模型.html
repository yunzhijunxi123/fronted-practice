<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            /* 内容区的宽 */
            width: 400px;
            /* 内容区的高 */
            height: 400px;
            /* 内边距 设置的背景颜色会填充内边距区域*/
            padding: 20px;
            background-color: gray;
            /* 边框 */
            border: 10px solid black ;
            /* 外边距 */
            margin: 50px;
        }
    </style>
</head>
<body>
    <div>你好啊</div>
</body>
</html>
