<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            font-size: 40px;
        }
        #d1{
            /* 第一种 px像素 */
            width: 200px;
            height: 200px;
            font-size: 20px;
            background-color: skyblue;
        }
        #d2{
            /* 第二种 em(相当于当前元素或其父元素的font-size的倍数) */
            width: 10em;
            height: 10em;
            font-size: 1em;
            background-color: orange;
        }
        #d3{
            /* 第三种 rem相对于根元素的font-size的倍数,找祖师爷*/
            width: 10em;
            height: 10em;
            font-size: 1rem;
            background-color: green;
        }
        #d4{
            /* 第三种 rem相对于根元素的font-size的倍数,找祖师爷*/
            width: 200px;
            height: 200px;
            font-size: 20px;
            background-color: gray;
        }
        .inside{
            /* 第四种 相对于其父元素的百分比 */
            width: 50%;
            height: 25%;
            font-size: 20px;
            background-color: orange;
        }
        .test{
            font-size: 20px;
            /* text-indent首行缩进 */
            text-indent: 2em;
            background-color: yellowgreen;
        }
    </style>
</head>
<body style="font-size: 30px;">
    <div id="d1">1</div>
    <br>
    <div id="d2">2</div>
    <br>
    <div id="d3">3</div>
    <br>
    <div id="d4" >
        <div class="inside">4</div>
    </div>
    <br>
    <div class="test">好好学习</div>
</body>
</html>
