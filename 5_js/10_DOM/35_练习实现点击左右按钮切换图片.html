<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        img{
            vertical-align: top;
        }
        ul{
            list-style: none;
        }
        .outer{
            width: 640px;
            height: 390px;
            margin: 100px auto;
            /* 子绝父相 */
            position: relative;
        }
        .img-list{
            height: 390px;
        }
        /* 下面的盖住最上面 */
        .img-list li{
            position: absolute;
            opacity: 0;
            transition: opacity .5s;
        }
        li.current{
            z-index: 1;
            opacity: 1;
        }
        .prev-next a{
            font-size: 60px;
            color: #fff;
            font-weight: bold;
            text-decoration: none;
            position: absolute;
            /* 需要有高度 */
            height: 60px;
            top: 0;
            bottom: 0;
            margin: auto;
            z-index: 2;
            opacity: .5;
        }
        .prev-next a:hover{
            opacity: 1;
        }
        #next{
            right: 0;
        }
        #prev{
            left: 0;
        }
    </style>
</head>
<body>
    <div class="outer">
        <ul class="img-list">
            <li class="current">
                <a href="#">
                    <img src="./images/1.png">
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="./images/2.png">
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="./images/3.png">
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="./images/4.png">
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="./images/5.png">
                </a>
            </li>
        </ul>
        <!-- 添加切换按钮 -->
        <div class="prev-next">
            <a id="prev" href="javascript:;"><</a>
            <a id="next" href="javascript:;">></a>
        </div>
    </div>
    <script>
        /*自动切换图片*/
        setTimeout(function auto(){
            //获取当前显示的图片
            // const current = document.getElementsByClassName("current")[0]
            const current = document.querySelector(".img-list .current")
            //获取下一个子元素
            // const next = current.nextElementSibling || document.getElementsByTagName("li")[0]//下一个或第一个
            const next = current.nextElementSibling || document.querySelector(".img-list li:first-child")//下一个或第一个
            current.classList.remove("current")
            next.classList.add("current")
            setTimeout(auto,3000)
        },3000)

        const prev = document.getElementById("prev")
        const next = document.getElementById("next")

        prev.onclick = () =>{
            const current = document.querySelector(".img-list .current")
            const prev = current.previousElementSibling || document.querySelector(".img-list li:last-child")//下一个或第一个
            current.classList.remove("current")
            prev.classList.add("current")
        }

        next.onclick = () =>{
            const current = document.querySelector(".img-list .current")
            const next = current.nextElementSibling || document.querySelector(".img-list li:first-child")
            // current 的下一个兄弟元素，如果已经是最后一个，就返回第一个元素
            current.classList.remove("current")
            next.classList.add("current")
        }
    </script>
</body>
</html>
