<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- <button id="btn" onclick="alert('你点我干嘛')">点我一下</button> -->
    <button id="btn">点我一下</button>
    <script>
        /*
            事件是用户也页面之间的交互行为
                点击按钮、鼠标移动、双击按钮、敲击键盘、松开按键
            为事件绑定响应函数
                1.直接在元素的属性中设置
                2.为元素的指定属性设置回调函数的形式来绑定事件
                一个事件只能绑定一个响应函数
                3.通过元素addEventListener()方法来绑定事件 
        */  
        //获取按钮对象
        const btn = document.getElementById("btn")
        //为按钮对象的事件属性设置响应函数
        // btn.onclick = function(){
        //     alert("我又被点了一下")
        // }
        btn.onclick = function(){
            alert("114114")
        }
        btn.addEventListener("click",function(){
            alert("哈哈哈")
        })   
        btn.addEventListener("click",function(){
            alert("嘿嘿嘿")
        })
        btn.addEventListener("click",function(){
            alert("呵呵呵")
        })    
    </script>
</body>

</html>
