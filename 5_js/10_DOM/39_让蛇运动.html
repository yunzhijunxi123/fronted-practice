<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      #main {
        height: 420px;
        width: 360px;
        border: 10px #000 solid;
        background-color: #b7d4a8;
        border-radius: 20px;
        margin: 50px auto;
      }

      #stage {
        width: 304px;
        height: 304px;
        border: 2px solid #000;
        margin: 20px auto;
        position: relative;
      }
      #snake > div {
        width: 10px;
        height: 10px;
        background-color: #000;
        position: absolute;
      }
      #food {
        width: 10px;
        height: 10px;
        background-color: #000;
        position: absolute;
        top: 100px;
        left: 120px;
        display: flex;
        /* 自动换行 */
        flex-flow: wrap;
      }
      #food > div {
        width: 5px;
        height: 5px;
        background-color: #000;
        transform: rotate(45deg);
      }
      #info {
        width: 304px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        font: bold 20px courier;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <div id="stage">
        <div id="snake">
          <div></div>
        </div>
        <div id="food">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>

      <div id="info">
        <div>SCORE:<span id="score">100</span></div>
        <div>LEVEL:<span id="level">1</span></div>
      </div>
    </div>
    <script>
      //获取蛇的容器
      const snake = document.getElementById("snake");
      const snakes = snake.getElementsByTagName("div");
      const head = snakes[0];
      //获取食物
      const food = document.getElementById("food");
      /*
            食物坐标在0到290之间
        */
      function changeFood() {
          const x =  Math.floor(Math.random()*30)*10
          const y =  Math.floor(Math.random()*30)*10
          food.style.left = x+"px"
          food.style.top = y+"px"   
      }
      changeFood()
      //定义一个变量存储蛇的移动方向
      let dir;
      const keyArr = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];

      //速度和方向分开控制
      document.addEventListener("keydown", (event) => {
        if (keyArr.includes(event.key)) {
          dir = event.key;
        }
        /*通过事件对象可读取到用户按的是哪个按键*/
      });

      //速度由定时器控制
      setTimeout(function move() {
        switch (dir) {
          case "ArrowUp":
            head.style.top = head.offsetTop - 10 + "px";
            break;
          case "ArrowDown":
            head.style.top = head.offsetTop + 10 + "px"; //新的距离=当前的距离+10
            break;
          case "ArrowLeft":
            head.style.left = head.offsetLeft - 10 + "px";
            break;
          case "ArrowRight":
            head.style.left = head.offsetLeft + 10 + "px"; //距离父容器的左边界距离
            break;
        }
        if (
          head.offsetTop === food.offsetTop &&
          head.offsetLeft === food.offsetLeft
        ) {
          changeFood()
            snake.insertAdjacentHTML("beforeend","<div/>")
        }
        setTimeout(move, 100);
      }, 100);
    </script>
  </body>
</html>
