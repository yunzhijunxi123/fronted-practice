<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box1 {
        width: auto;
        height: 200px;
        /* !important 最高优先级 */
        background-color: #bfa !important;
      }
      .box1::before{
        content: "hello";
        color: red;
      }
    </style>
  </head>
  <body>
    <button id="btn">点我一下</button>
    <hr />
    <div class="box1" style="width: 300px"></div>
    <script>
      /*
            点击按钮后 读取元素的css样式
        */
      const btn = document.getElementById("btn");
      const box1 = document.querySelector(".box1"); //查找类为.box1的元素
      btn.onclick = function () {
        //console.log(box1.style.width); //读取内联样式
        //读取生效的样式 返回一个对象 对象中包含了当前元素所有生效的样式
        const styleObj = getComputedStyle(box1);//要获取的样式的对象 要获取的伪元素
        //返回的是一个对象 对象中存储当前元素的样式
        //返回的样式值 不一定能拿来直接计算
        //使用时 确保值是可以计算的才去计算
        console.log(styleObj.width);
        console.log(styleObj.left);
        
        
        // console.log(parseInt(styleObj.width)+100);
        box1.style.width = parseInt(styleObj.width)+100+"px"
        // console.log(styleObj.backgroundColor);
        const beforeStyle = getComputedStyle(box1,"::before")
        //console.log(beforeStyle.color);
      };
    </script>
  </body>
</html>
