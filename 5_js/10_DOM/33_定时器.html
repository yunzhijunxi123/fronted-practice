        定时器的本质 指定时间后 将函数添加到消息队列中
        0秒: 开始计时，注册3秒后要执行的函数
        3秒: 定时器到期，但主线程还在while循环中
              → 回调函数被放入消息队列等待
        6秒: while循环结束，主线程空闲
        6秒: 从消息队列中取出回调函数执行
              → 此时console.timeEnd()显示约6秒
      */
