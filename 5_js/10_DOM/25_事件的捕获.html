<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #box1{
      width: 300px;
      height: 300px;
      background-color: green;
    }
    #box2{
      width: 200px;
      height: 200px;
      background-color: orange;
    }
    #box3{
      width: 100px;
      height: 100px;
      background-color: red;
    }
  </style>
</head>
<body>
    <div id="box1">
      <div id="box2">
        <div id="box3">

        </div>
      </div>
    </div>
    <script>
      /*
        事件的传播机制
          在DOM中 事件的传播分为三个阶段
          1.捕获阶段(事件不会在捕获阶段触发 如果希望在捕获阶段触发 addEventListener第三个参数设置为true)
          2.目标阶段
          3.冒泡阶段
          事件的捕获 事件从外向内的传导
            当前元素触发事件后 先从当前元素最大的祖先元素开始向当前元素开始事件的捕获
            点击box3 先看document html body box1 box2 box3(直到点击的位置)
      */
      const box1 = document.getElementById("box1")
      const box2 = document.getElementById("box2")
      const box3 = document.getElementById("box3")
      box1.addEventListener("click",function(event){
        alert("1"+event.eventPhase)//event.eventPhase 1是捕获 2是目标 3是冒泡
      })
      // box1.addEventListener("click",function(event){
      //   alert(1)
      // },true)一般不希望事件在捕获阶段触发
      box2.addEventListener("click",function(event){
        alert("2"+event.eventPhase)
      })
      box3.addEventListener("click",function(event){
        alert("3"+event.eventPhase)
      })
    </script>
</body>
</html>
