<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #box1{
      width: 100px;
      height: 100px;
      background-color: green;
      border-radius: 50%;
      position: absolute;
      /* 开启绝对定位*/
    }
    #box2{
      width: 400px;
      height: 400px;
      background-color: orange;
    }
    #box3{
      width: 200px;
      height: 200px;
      background-color: tomato;
    }
    #box4{
      width: 100px;
      height: 100px;
      background-color: skyblue;
      position: absolute;
      bottom: 0;
    }
  </style>
</head>
<body>
  <div id="box1"></div>
  <div id="box2"></div>
  <div id="box3" onclick="alert(333)">
    <div id="box4" onclick="alert(444)"></div>
  </div>
  <script>
    /*
      使小绿球随鼠标移动
      事件的冒泡和样式无关 只和结构有关
    */
   const box1 = document.getElementById("box1")
   const box2 = document.getElementById("box2")
   document.addEventListener("mousemove",(event)=>{//鼠标只要在整个网页移动 就触发
      box1.style.left = event.x+"px"//
      box1.style.top = event.y+"px"
   })
  //  box2.addEventListener("mousemove",event=>{
  //   event.stopPropagation()
  //  })
  </script>
</body>
</html>
