<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      img {
        vertical-align: top;
      }
      ul {
        list-style: none;
      }
      .outer {
        width: 640px;
        height: 390px;
        margin: 100px auto;
        /* 子绝父相 */
        position: relative;
      }
      .img-list {
        height: 390px;
      }
      /* 下面的盖住最上面 */
      .img-list li {
        position: absolute;
        opacity: 0;
        transition: opacity 0.5s;
      }
      li.current {
        z-index: 1;
        opacity: 1;
      }
      .prev-next a {
        font-size: 60px;
        color: #fff;
        font-weight: bold;
        text-decoration: none;
        position: absolute;
        /* 需要有高度 */
        height: 60px;
        top: 0;
        bottom: 0;
        margin: auto;
        z-index: 2;
        opacity: 0.5;
      }
      .prev-next a:hover {
        opacity: 1;
      }
      #next {
        right: 0;
      }
      #prev {
        left: 0;
      }
      .dot{
        position: absolute;
        z-index: 3;
        /* 红点在容器内的居中 */
        display: flex;
        justify-content: center;
        /* 正是因为开启绝对定位 元素的宽度拉伸到父容器宽度
        自动计算左右边距 .dot在父容器中水平居中 */
        left: 0; 
        right: 0;
        bottom: 5px;
        margin: auto;
      }
      .dot a{
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background-color: #fff;
        margin: 5px;
        opacity: .5;
      }
      /* active 是当前选中的点 */
      .dot a:hover,.dot .active{
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="outer">
      <ul class="img-list">
        <li class="current">
          <a href="#">
            <img src="./images/1.png" />
          </a>
        </li>
        <li>
          <a href="#">
            <img src="./images/2.png" />
          </a>
        </li>
        <li>
          <a href="#">
            <img src="./images/3.png" />
          </a>
        </li>
        <li>
          <a href="#">
            <img src="./images/4.png" />
          </a>
        </li>
        <li>
          <a href="#">
            <img src="./images/5.png" />
          </a>
        </li>
      </ul>
      <!-- 添加切换按钮 -->
      <div class="prev-next">
        <a id="prev" href="javascript:;"><</a>
        <a id="next" href="javascript:;">></a>
      </div>
      <!-- 导航点 -->
      <div class="dot">
        <a  class="active" href="javascript:;"></a>
        <a href="javascript:;"></a>
        <a href="javascript:;"></a>
        <a href="javascript:;"></a>
        <a href="javascript:;"></a>
      </div>
    </div>
    <!-- <button id="autoChangeBtn">自动切换</button> -->

    <script>
      /*
      */
      const dots = Array.from(document.querySelectorAll(".dot a")) 
      document.addEventListener("click",(event)=>{
        const index = dots.indexOf(event.target)
        if(index!=-1){
          //切换图片
          const current = document.querySelector(".img-list .current");
          //取得要切换的图片
          const next = document.querySelectorAll(".img-list li")[index]
          current.classList.remove("current");
          next.classList.add("current")
          //切换active
          const dotCurrent = document.querySelector(".dot .active")
          dotCurrent.classList.remove("active")
          event.target.classList.add("active")

        }
      })

      /*自动切换图片*/
      //利用闭包 只有toggleChange能访问timer
      //创建匿名函数 让函数作为返回值返回 定义变量引用他
      const toggleChange= (function () {
        let timer = null;
        return () => {
          //第一次开启 第二次关闭
          //判断timer是否是null
          if (timer === null) {
            timer = setTimeout(function auto() {
              changeImg("next");
              timer = setTimeout(auto, 3000);
            }, 3000);
          } else {
            clearTimeout(timer);
            timer = null;
          }
        };
      })();

      toggleChange(); //默认进入
      const outer = document.getElementsByClassName("outer")[0];
      outer.onmouseenter = () => {
        //鼠标进入则关闭
        toggleChange();
      };
      outer.onmouseleave = () => {
        //鼠标离开则开启
        toggleChange();
      };
      //   const auto = document.getElementById("autoChangeBtn");
      //   auto.onclick = () => {
      //     toggleChange();
      //   };

      const prev = document.getElementById("prev");
      const next = document.getElementById("next");

      prev.onclick = () => {
        changeImg("prev");
      };

      next.onclick = () => {
        changeImg("next");
      };
      /*
            changeImg 用来切换图片
                dir 切换图片的方向  next   prev
        */
      function changeImg(dir) {
        const current = document.querySelector(".img-list .current");
        //获取下一张图片
        let next;
        if (dir === "next") {
          next =
            current.nextElementSibling ||
            document.querySelector(".img-list li:first-child");
          // current 的下一个兄弟元素，如果已经是最后一个，就返回第一个元素
        } else if (dir === "prev") {
          next =
            current.previousElementSibling ||
            document.querySelector(".img-list li:last-child");
          //下一个或最后一个
        }
        current.classList.remove("current");
        next.classList.add("current");
        changeDot(dir)
      }
      function changeDot(dir) {
        const dotCurrent = document.querySelector(".dot .active")
        //获取下一张图片
        let next;
        if (dir === "next") {
          next =
            dotCurrent.nextElementSibling ||
            document.querySelector(".dot a:first-child");
          // current 的下一个兄弟元素，如果已经是最后一个，就返回第一个元素
        } else if (dir === "prev") {
          next =
            dotCurrent.previousElementSibling ||
            document.querySelector(".dot a:last-child");
          //下一个或最后一个
        }
        dotCurrent.classList.remove("active")
        next.classList.add("active");
      }
      
    </script>
  </body>
</html>
