<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer {
            width: 640px;
            margin: 50px auto;
            text-align: center;
        }
    </style>
    <script>
        window.onload = function () {
            /*
                点击按钮切换图片
            */
            //获取info
            const info = document.getElementById("info")

            //获取到图片
            const img = document.getElementsByTagName("img")[0]
            const prev = document.getElementById("prev")
            const next = document.getElementById("next")
            //创建数组存储图片的路径
            const imgArr = ["./images/1.png", "./images/2.png", "./images/3.png", "./images/4.png", "./images/5.png"]
            let current = 0

            info.textContent = `总共${imgArr.length}张图片，当前第${current+1}张图片`
            prev.onclick = function () {
                //关闭定时器
                clearTimeout(timer)
                current -= 1
                if (current < 0) {//要加以判断
                    current = 0
                }
                img.src = imgArr[current]
                info.textContent = `总共${imgArr.length}张图片，当前第${current+1}张图片`
            }
            next.onclick = function () {//点击next按钮切换下一张图片
                //关闭定时器
                clearTimeout(timer)
                current += 1
                if (current >= imgArr.length) {
                    current = 0
                }
                img.src = imgArr[current]
                info.textContent = `总共${imgArr.length}张图片，当前第${current+1}张图片`
            }
            const autoBtn = document.getElementById("auto")
            //创建一个变量来存储定时器的id
            let timer
            autoBtn.addEventListener("click",function(event){//频繁点击按钮 会开启多个定时器
                //关闭定时器
                clearTimeout(timer)
                //开启定时器 切换图片
                timer=setTimeout(function auto(){
                    next.onclick()
                    timer = setTimeout(auto,3000)
                },3000)
            })
        }

    </script>
</head>

<body>
    <div class="outer">
        <p id ="info">
            总共n张图片，当前为第n张图片
        </p>
        <div class="img-wrapper">
            <img src="./images/1.png" alt="这是一个图片">
        </div>
        <div class="btn-wrapper">
            <button id="prev">上一张</button>
            <button id="auto">自动</button>
            <button id="next">下一张</button>
        </div>
    </div> 

</body>

</html>
