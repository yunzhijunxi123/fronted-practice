<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #box1 {
        width: 300px;
        height: 300px;
        background-color: green;
      }
      #box2{
        width: 250px;
        height: 250px;
        background-color: orange;
      }
      #box3{
        width: 200px;
        height: 200px;
        background-color: red;
      }
    </style>
  </head>
  <body>
    <div id="box1">
      <div id="box2">
        <div id="box3">

        </div>
      </div>
    </div>
    <a id="chao" href="https://lilichao.com">超链接</a>
    <script>
      /*
        DOM中存在着多种不同类型的事件对象
          多种事件对象有一个共同的祖先 Event
          event.target 触发事件的对象
          event.currentTarget 绑定事件的对象
          event.stopPropagation() 取消事件的传导
          event.preventDefault() 取消默认行为

        事件的冒泡 向上传导
        当元素的某个事件被触发后 祖先元素上的相同时间也会同时触发
      */
      const box1 = document.getElementById("box1")
      const box2 = document.getElementById("box2")
      const box3 = document.getElementById("box3")
      const link = document.getElementById("chao")
      // link.onclick = function(){
      //   alert("被点了")
      //   return false
      // }
      link.addEventListener("click",function(event){
        event.preventDefault()//取消默认行为
        alert("被点了")
        //return false   addEventListener不中用了
      })
      // box1.addEventListener("click",event =>{

      // })
      box1.addEventListener("click",function(event){
        console.log(event.target);//触发事件的对象
        console.log(this);//绑定事件的对象
        console.log(event.currentTarget);//同(this)
        
        alert("我是box1")      
      })
      box2.addEventListener("click",function(event){
        event.stopPropagation()
        alert("我是box2")
      })
      box3.addEventListener("click",function(event){//哪怕去掉也会冒泡
        event.stopPropagation();//取消事件的传导
        alert("我是box3") 
      })
    </script>
  </body>
</html>
