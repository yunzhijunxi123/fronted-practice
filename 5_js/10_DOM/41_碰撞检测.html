<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      #main {
        height: 420px;
        width: 360px;
        border: 10px #000 solid;
        background-color: #b7d4a8;
        border-radius: 20px;
        margin: 50px auto;
      }

      #stage {
        width: 304px;
        height: 304px;
        border: 2px solid #000;
        margin: 20px auto;
        position: relative;
      }
      #snake > div {
        width: 10px;
        height: 10px;
        background-color: #000;
        position: absolute;
        border: 1px solid #b7d4a8;
      }
      #food {
        width: 10px;
        height: 10px;
        background-color: #000;
        position: absolute;
        top: 100px;
        left: 120px;
        display: flex;
        /* 自动换行 */
        flex-flow: wrap;
      }
      #food > div {
        width: 5px;
        height: 5px;
        background-color: #000;
        transform: rotate(45deg);
      }
      #info {
        width: 304px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        font: bold 20px courier;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <div id="stage">
        <div id="snake">
          <div></div>
        </div>
        <div id="food">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>

      <div id="info">
        <div>SCORE:<span id="score">0</span></div>
        <div>LEVEL:<span id="level">1</span></div>
      </div>
    </div>
    <script>
      //获取蛇的容器
      const snake = document.getElementById("snake");
      const snakes = snake.getElementsByTagName("div");
      //获取食物
      const food = document.getElementById("food");
      const scoreSpan = document.getElementById("score")
      const levelSpan = document.getElementById("level")
      //创建变量存储分数和等级
      let score = 0
      let level = 0
      /*
            食物坐标在0到290之间
        */
      function changeFood() {
        const x = Math.floor(Math.random() * 30) * 10;
        const y = Math.floor(Math.random() * 30) * 10;
        food.style.left = x + "px";
        food.style.top = y + "px";
      }
      //changeFood();
      //定义一个变量存储蛇的移动方向
      let dir;
      //创建变量来记录按键的状态
      let keyActive = true;

      const keyArr = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
      const reObj = {
        ArrowUp: "ArrowDown",
        ArrowDown: "ArrowUp",
        ArrowLeft: "ArrowRight",
        ArrowRight: "ArrowLeft",
      };
      /*
          禁止掉头
            1.身体超过2
            2.不能是相反的方向
          处理
            保持原来方向不变
      */
      //速度和方向分开控制
      document.addEventListener("keydown", (event) => {
        if (keyActive && keyArr.includes(event.key)) {
          //dir：变量里保存的是蛇当前正在移动的方向。
          // event.key：是用户刚刚按下的键，代表想要改变的新方向。
          if (snakes.length < 2 || reObj[dir] !== event.key) {
            dir = event.key;
            keyActive = false;
          }
        }
        /*通过事件对象可读取到用户按的是哪个按键*/
      });

      /*身体和头一起移动 只需在蛇移动时 蛇尾变蛇头*/
      //速度由定时器控制 每秒约移动10次
      let isGameOver = false;
      setTimeout(function move() {
        keyActive = true;
        //获取蛇头
        const head = snakes[0];
        let x = head.offsetLeft;
        let y = head.offsetTop;
        switch (dir) {
          case "ArrowUp":
            y -= 10;
            break;
          case "ArrowDown":
            y += 10;
            break;
          case "ArrowLeft":
            x -= 10;
            break;
          case "ArrowRight":
            x += 10;
            break;
        }
        if (
          head.offsetTop === food.offsetTop &&
          head.offsetLeft === food.offsetLeft
        ) {
          changeFood();
          snake.insertAdjacentHTML("beforeend", "<div/>");
          score++
          scoreSpan.textContent = score
          if(score%3===0&&level<14){
            level++
            levelSpan.textContent = level+1
          }
        }
        /*判断是否撞墙*/
        if (x < 0 || x > 290 || y < 0 || y > 290) {
          alert("撞墙了 游戏结束");
          return;
        }
        /*是否撞到自己*/

        for (let i = 0; i < snakes.length - 1; i++) {
          //不用取蛇尾 蛇头移动蛇尾也跟着移动
          if (snakes[i].offsetLeft === x && snakes[i].offsetTop === y) {
            alert("撞到自身 游戏结束");
            return;
          }
        }

        /*核心移动逻辑*/
        //获取尾巴
        const tail = snakes[snakes.length - 1];
        //将尾巴移动到新头部的位置
        tail.style.left = x + "px";
        tail.style.top = y + "px";
        //将尾巴插入到容器最前面
        snake.insertAdjacentElement("afterbegin", tail);
        setTimeout(move, 300-level*20); //定时器不再设置 游戏结束
      }, 300);
    </script>
  </body>
</html>
