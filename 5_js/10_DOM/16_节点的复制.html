<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="btn01">点我一下</button>
    <ul id="list1">
        <li id="l1">孙悟空</li>
        <li id="l2">猪八戒</li>
        <li id="l3">沙和尚</li>
    </ul>
    <ul id="list2">
        <li>蜘蛛精</li>
    </ul>
    <script>
        /*点击按钮后 id为l1的元素添加到list2中*/
        const list2 = document.getElementById("list2")
        const l1 = document.getElementById("l1")
        const btn01 = document.getElementById("btn01")
        btn01.onclick = function(){
            //克隆节点 cloneNode只复制当前节点 不会复制节点的子节点 传递true 元素的子节点一起复制
            const newL1 = l1.cloneNode(true)//用来对节点进行复制 newL1没有文本
            list2.appendChild(newL1)
        }
    </script>
</body>
</html>
