<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>
    <button id="btn01">按钮1</button>
    <button id="btn02">按钮2</button>
    <hr>
    <ul id="list">
        <li id="swk">孙悟空</li>
        <li id="zbj">猪八戒</li>
        <li id="shs">沙和尚</li>
        
    </ul>
    <script>
        /*
            点击按钮中，向ul添加一个唐僧
            1.获取按钮和ul
            2.在点击按钮时 创建新li
        */
        const list = document.getElementById("list")
        const btn01 = document.getElementById("btn01")
        btn01.onclick = function(){ //添加白骨精
            
            //<li id="ts">唐僧</li>
            //创建一个li
            const li = document.createElement("li")
            li.innerText = "唐僧"
            li.id = "ts"
            //list.appendChild(li)//用于给一个节点ul添加子节点li
            //两个参数 1.参数添加的位置 2.要添加的元素
            //beforebegin 在元素的前边插入元素(兄弟元素)
            //afterend 在元素的后边插入元素(兄弟元素)

            //非常好用
            // list.insertAdjacentElement("beforeend",li)
            list.insertAdjacentHTML("beforeend","<li id='bgj'>白骨精</li>")

        }
        const btn02 = document.getElementById("btn02")
        btn02.onclick = function(){//把孙悟空替换成蜘蛛精
            const li = document.createElement("li")
            li.textContent="蜘蛛精"
            li.id="zzj"
            const swk = document.getElementById("swk")
            //replaceWith() 替换元素
            swk.replaceWith(li)

            //删除当前元素
            swk.remove()
        }
    </script>

</body>

</html>
