<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button id="btn">点我一下</button>
    <span class="s1"></span>
    <span class="s1"></span>
    <span class="s1"></span>
    <span class="s1"></span>
    <span class="s1"></span>
    <div>我是div</div>
    <div>我是div</div>
    <div>我是div</div>
    <div>我是div</div>
    <div>我是div</div>

    <form action="">
        <input type="text" name="username">
        <input type="radio" name="gender" value="male">男
        <input type="radio" name="gender" value="female">女
    </form>
    <script>

        /*
            元素节点对象（element）
            在网页中，每一个标签都是一个元素节点
            如何获取元素节点对象
                1.通过document对象来获取元素节点
                2.通过document对象来创建元素节点
        */
        const btn = document.getElementById("btn")//获取一个
        const spans = document.getElementsByClassName("s1")//返回类数组对象
        //该方法返回的是实时更新的集合
        const divs = document.getElementsByTagName("div")
        //console.log(spans);
        // for(let i=0;i<spans.length;i++){
        //     spans[i].innerText = "哈哈哈"+i
        // }
        const genderInput = document.getElementsByName("gender")//主要用于表单项 获取一组
        console.log(genderInput);
        const div2 = document.querySelectorAll("div") //根据选择器去页面查询元素 不会实时更新 
        console.log(div2);
        const div = document.querySelector("div")//查询第一个符合条件的元素
        console.log(div);
        const h2 = document.createElement("h2")//根据标签名创建一个元素节点对象
    </script>
</body>

</html>
