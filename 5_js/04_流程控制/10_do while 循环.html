<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // while 先判断后执行
        // do while 先执行后判断 至少执行一次
        let i = 0
        while(i<5){
            console.log(i)
            i++
        }

        let j = 0
        do{
            console.log(j)
            j++
        }while(j<5)
    </script>
</head>

<body>

</body>

</html>
