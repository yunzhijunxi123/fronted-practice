<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        console.time("质数练习")
        for (let i = 2; i <= 100; i++) {
            let flag = true;//是质数
            for (let j = 2; j * j <= i; j++) {
                if (i % j === 0) {
                    flag = false;
                    break;
                }
            }
            if (flag) {
                console.log(i)
            }
        }
        console.timeEnd("质数练习")

    </script>
