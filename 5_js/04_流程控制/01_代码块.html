<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*
            使用{}创建代码块 
            一个代码块中代码要么全执行要么全不执行

            用let声明的变量 具有块作用域 
            用var声明的变量 不具有块作用域 
            在代码块中声明的变量，无法在代码块的外部访问
        */
        {
            let a = 10 ,b = 20
            console.log(a)
        }
        {
            console.log(b)
        }
    </script>
</head>

<body>

</body>

</html>
