<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        span{
            display: inline-block;
            width: 100px;
        }
    </style>
    <script>
        for(let i=1;i<=9;i++){
            for(let j=1;j<i+1;j++){
                let result = i*j
                document.write(`<span>${j}×${i}=${result} &nbsp;</span>`)
            }
            document.write("<br>")
        }
    </script>
</head>

<body>
</body>

</html>
