<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let num = +prompt("请输入一个整数")
        //NaN不和任何值相等,用==或===无法校验
        // isNaN()函数检查是否是NaN

        if (isNaN(num) || num % 1 !== 0) {
            alert("输入问题")
        } else {
            if (num % 2 === 1) {
                alert(`${num}是奇数`)
            } else {
                alert(`${num}是偶数`)
            }
        }
    </script>
</head>

<body>

</body>

</html>
