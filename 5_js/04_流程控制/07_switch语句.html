<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let num = +prompt("请输入一个数字")
        // 用break避免贯穿
        switch(num){
            case 1:
                alert("壹")
                break
            case 2:
                alert("贰")
                break
            case 3:
                alert("叁")
                break
            //case均为假
            default:
                alert("都不是")
                break
        }
    </script>
</head>

<body>

</body>

</html>
