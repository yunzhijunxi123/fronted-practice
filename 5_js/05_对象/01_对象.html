<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /* 数据类型
                原始值
                数值 大整数 字符串 布尔值 空值 未定义 符号
            读取的是一个对象中没有的属性 不会报错 而是undefined
         */
        let obj = new Object()
        obj.name ="孙悟空"
        obj.age = "18"
        obj.gender = "male"
        //修改属性
        obj.name = "Tom sun"
        //删除属性
        delete obj.name
        console.log(obj)
    </script>
</head>
