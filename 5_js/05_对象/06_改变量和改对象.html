<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //核心在于修改变量还是修改对象
        //改成常量，避免变量指向的对象被改变
        //const禁止变量被重新赋值 禁止改变量
        const obj = {
            name: "孙悟空"
        }
        const obj2 = obj

        //obj2={}//修改变量
        obj2.name="猪八戒"//修改对象
        //obj2 = null
        console.log(obj)
        console.log(obj2)
    </script>
</head>

<body>

</body>

</html>
