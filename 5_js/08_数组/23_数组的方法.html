    <script>
        let arr = ["a", "c", "d", "e", "f", "b"]
        arr = ["2", "3", "1", "0", "4", "5"]
        /*
            sort() 
                对数组进行排序(会改变原数组)
                默认按照Unicode编码排序
            forEach() 
                用来遍历数组 需要一个回调函数作为参数
                数组中有几个元素 回调函数就会调用几次
            filter()
                将数组中符合条件的元素保存到一个新数组中返回
                需要一个回调函数作为参数 为每一个元素调用回调函数
                根据返回值决定是否将元素添加到新数组中
                非破坏性方法 不影响原数组
            map()
                根据当前数组生成新数组
                非破坏性方法
            reduce()
                将一个数组中的所有元素整合成一个值
                通过回调函数指定合并规则
                可选参数，初始值

        */
        console.log(arr);
        // arr.sort()
        arr.sort((a, b) => a - b)//升序
        console.log(arr);
        arr.sort((a, b) => b - a)//降序
        console.log(arr);
        arr = ["孙悟空", "猪八戒", "沙和尚"]
        arr.forEach((a, b, c) => {//元素 索引 数组
            console.log(a, b, c);
        })
        arr = [1, 2, 3, 4, 5, 6, 7, 8]

        let result = arr.filter((ele) => ele % 2 === 0)

        result = arr.map((ele) => ele * 2)
        arr = ["孙悟空", "猪八戒", "沙和尚"]

        /*

            return a+b
        })
        //result = arr.reduce((a,b)=>{return a*b})
        result = arr.reduce((a,b)=>a*b)
        console.log(result);
    </script>
