<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const arr=["孙悟空","猪八戒","沙和尚"]
        /*
            push()
            pop( )
            unshift()
            shift()
            splice()
        */
        arr.push("唐僧","白骨精")//向数组末尾添加一个或多个元素 并返回新的长度
        console.log(arr);
        arr.pop()//删除并返回数组的最后一个元素
        console.log(arr);
        arr.unshift("牛魔王")//向数组开头添加一个或多个元素
        console.log(arr);
        arr.shift()//删除并返回数组第一个元素
        console.log(arr);

        const arr2=["孙悟空","猪八戒","沙和尚","唐僧"]
        //arr.splice(1,3)//参数：删除的起始位置 删除的数量 返回值：返回被删除的元素
        //arr.splice(1,1,"牛魔王")//删除的起始位置 删除的数量 要插入的元素
        arr2.splice(1,0,"牛魔王")

        console.log(arr2);
        
        arr3=["a","b","c","d"]
        arr3.reverse()//反转数组
        console.log(arr3);
        
        
    </script>
</head>

</body>

</html>
