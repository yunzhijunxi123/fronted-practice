        /*
            1.函数的嵌套
            2.内部函数要引用外部函数的嵌套
            3.内部函数作为返回值返回
        */
        function outer(){//闭包 能访问到外部函数作用域中变量的函数
            let num = 0//位于函数作用域中 里面能看到外边 外边看不到里面
            return ()=>{
                num++;
                console.log(num);
            }
        }
        let newFn = outer()
        console.log(newFn);
        num = 1000//改不了
        newFn()
        newFn()
        newFn()
