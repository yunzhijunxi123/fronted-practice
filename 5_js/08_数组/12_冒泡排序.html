<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //冒泡排序 最慢
        const arr = [5, 8, 7, 4, 3, 1, 2, 9, 6]
        
        for (let i = 0; i < arr.length-1; i++) {//外层控制轮数
            for(let j=0;j<arr.length-1-i;j++)//内层进行相邻比较
            if (arr[j] > arr[j + 1]) {
                let temp = arr[j]
                arr[j] = arr[j + 1]
                arr[j + 1] = temp
            }
        }
        console.log(arr);
    </script>
</head>
