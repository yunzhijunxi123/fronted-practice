<head>

    <title>Document</title>
    <script>
        /*
            bind() 函数的方法 用来创建一个新的函数
                bind为新函数绑定this
                bind可为新函数绑定参数
        */
        function fn(a,b,c) {
            console.log("fn执行了",this);
            console.log(a,b,c);
        }
        const obj = {name:"孙悟空"}
        const newFn = fn.bind(obj,10,20,30)//newFn的this就是obj
        newFn()
        const arrowFn =()=>{
            console.log(arguments);
            
            console.log(this);//箭头函数没有自身的this 由外层作用域决定
            //无法通过call apply bind 修改它的this
            //箭头函数中没有arguments
        }
        // arrowFn.apply(obj)
        const newArrowFn = arrowFn.bind(obj)
        // newArrowFn() 
        class MyClass{
            fn = () =>{
                console.log(this);
            }
        }
        const mc = new MyClass()
        mc.fn.call(Window)
    </script>
