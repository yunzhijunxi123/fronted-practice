<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /* 
            ++自增运算符与自减运算符
         */
        let a = 10, b=10
        a=a++;//先用后加
        b=++b;//先加后用
        console.log(a,b)

        let c = 15
        console.log('c--',c--)
        console.log('--c',--c)
        
        console.log(c)
    </script>
</head>

</body>
 
</html>
