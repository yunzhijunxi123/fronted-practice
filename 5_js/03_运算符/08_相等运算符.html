<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /* 
            ==相等运算符 比较两个值是否相等
            转换为相同类型，再比较

            ===全等运算符 不会进行自动类型转换 用的多
         */
        let result = 1 == 1//true
        result = 1 == '1'//true

        result = null == undefined//true
        result = NaN == NaN //false NaN不和任何值相等

        result = 1 === "1"

        console.log(result)
    </script>
</head>
