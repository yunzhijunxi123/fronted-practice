<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        class Person {
            constructor(name) {//构造函数
                this.name = name
            }
        }
        class Dog {
            constructor(name) {
                this.name = name
            }
        }
        class Test{

        }
        const p1 = new Person("小明")
        const d1 = new Dog("旺财")
        const test = new Test()
        console.log(p1);
        console.log(d1);
        /*
            定义一个函数 接收一个对象作为参数 输出hello并打印对象的name属性
            要调用某个函数 无需指定的类型 只要对象满足某些条件即可

            一个东西走路像鸭子 叫起来像鸭子 那么它就是鸭子
            
            多态为我们提供灵活性
        */
        function sayHello(obj) {
            if(obj instanceof Person){//检查类型
                console.log("Hello "+obj.name);
            }
        }
        sayHello(d1)
        sayHello(p1)
        //sayHello(test)
    </script>
</head>
