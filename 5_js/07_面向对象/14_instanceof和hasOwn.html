<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*
            大部分情况下 无需修改原型对象
            原型要改 也要通过类.prototype属性去修改
            最好不要直接给prototype去赋值 会把之前的原型覆盖
        */
        class Animal{}
        class Dog extends Animal{}
        const dog = new Dog()
        /*
            instanceof          检查一个对象是否是一个类的实例
            只要原型链上有 就会返回true
            dog Animal实例 Object实例 Object原型 
            Object 是所有对象的原型
        */
        console.log(dog instanceof Dog);
        console.log(dog instanceof Animal);
        const obj = new Object()

        console.log(obj.__proto__);//1 实例
        console.log(Object.prototype);//2 类
        console.log(dog.__proto__);
        console.log(Dog.prototype);
        class Person{
            name = "孙悟空"
            age = 18
            sayHello(){
                console.log("Hello 我是",this.name);
            }
        }
        const p = new Person()
        console.log("name" in p);
        console.log("gender" in p);
        /*
            in运算符检查属性时 无论属性在对象自身还是原型中 都返回true

            对象.hasOwnProperty(属性名) 检查一个对象自身是否含有某个属性

            Object.hasOwn(对象，属性名) 

            null没有原型链 不行
        */
        console.log("sayHello" in p);

        console.log(p.hasOwnProperty("name"));//true name直接在对象本身
        console.log(p.hasOwnProperty("sayHello"));// false sayHello不在对象本身

        console.log(Object.hasOwn(p,"name"));//推荐
        console.log(Object.hasOwn(p,"sayHello"));

    </script>
</head>

<body>

</body>

</html>
