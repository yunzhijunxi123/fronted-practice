<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*
            封装 继承 多态
            对象用来存储不同属性的容器
            对象不仅负责属性 还负责数据的安全
            直接添加到对象中的属性 并不安全 
            确保数据安全

            1.私有化数据  设置为只能在类内部使用
            2.提供setter getter 方法开发对数据的操作
            优点属性设置私有 通过getter setter 方法操作属性带来的好处
            可控制属性的读写权限
            可在方法中对属性进行验证
            封装方式：
                1.属性私有化 加#
                2.通过getter和setter方法来操作属性
                

        */    
        class Person {
            #address="花果山"//私有属性 只能在类内部访问

            #name
            #age
            #gender

            constructor(name,age,gender){
                this.#name=name
                this.#age=age
                this.#gender=gender
            }
            sayHello(){
                console.log(this.#name,this.#address);
            }
            getName(){//getter方法 读取属性
                return this.#name
            }
            setName(name){//setter方法 设置属性
                this.#name = name//新name替换旧name
            }
            getAge(){
                return this.#age
            }
            setAge(age){
                if(age>=0){
                    this.#age = age
                }
            }

            //推荐
            get gender(){
                console.log("getter执行");
                return this.#gender
            }
            set gender(gender){
                this.#gender=gender
            }
        }
        const p1 = new Person("孙悟空",18,"男")
        // p1.#age="hello" 改不了
        //p1.setName("猪八戒")
        p1.setAge(-14)
        p1.gender="女"//看上去改属性 实际调用方法
        console.log(p1.gender);
        p1.sayHello()
        
        
    </script>
</head>

<body>

</body>

</html>
