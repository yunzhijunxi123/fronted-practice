        */
        class Person {

        }
        class Dog {

        }
        // const Person = class{

        // }
        const p1= new Person()//调用构造函数创建对象
        const p2= new Person()

        const d1= new Dog()
        const d2= new Dog()
        console.log(p1 instanceof Person);//检查p1是否是Person
        console.log(d1 instanceof Person);
        
        const five = {
            name: "王老五",
            age: "18",
            height: 180,
            weight: 55,

            sleep() {
                console.log(this.name + "睡觉了");
            },

                console.log(this.name + "吃饭了");
