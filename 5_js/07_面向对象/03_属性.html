<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*
            类是创建对象的模板 创建的第一件事就是定义类
        */
        class Person{//类的代码块用于设置对象的属性
            name = "孙悟空"//实例属性 p1.name
            age = 18
            static test ="test静态属性"//用static声明的属性 为静态属性
            static hh = "hh"//通过类访问 Person.hh

        }
        const p1 =new Person()
        const p2 =new Person()
        console.log(p1);
        console.log(p2);
        
        
    </script>
</head>

<body>

</body>

</html>
