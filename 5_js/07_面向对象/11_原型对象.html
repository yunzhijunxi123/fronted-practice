<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*
           对象的内存结构 
           1.对象自身
                直接通过对象所添加的属性 位于对象自身中
                在类中通过x=y的形式添加的属性 位于对象自身中
           2.原型对象（prototype）
                对象中还有一些内容 会存储到其他对象中
                对象中会有个属性存储原型对象 叫做__proto__
                原型对象负责为对象存储属性
                访问对象中的属性 先找对象自身
                没有再去原型对象找

                会添加到原型对象中的情况：
                    1.在类中通过xxx(){}方式添加的方法 位于原型中
                    2.主动向原型中添加的属性和方法
        */
        class Person{
            name ="孙悟空"
            age = 18
            // constructor(){
            //     this.gender="男"
            // }
            sayHello(){
                console.log("Hello 我是",this.name);
            }
        }
        const p1 = new Person()
        console.log(p1)
        /*
            原型对象中的数据
                1.对象中的数据（属性 方法sayHello
                2.constructor 对象中的构造函数

            原型对象也有原型 构成了一条原型链
            根据对象复杂程度不同，原型链的长度也不同
            p对象 原型 原型 null
            obj对象 原型 null
            
            作用域链 找变量的链 找不到报错
            原型链 读取对象属性时 就近原则 找不到返回undefined
            
        */
        //console.log(p1.constructor);
       
        console.log(p1.__proto__.__proto__);//sayHello32行如果是箭头函数 就可以看到
        console.log(Object.getPrototypeOf(p1)===p1.__proto__);
        
    </script>
</head>

<body>

</body>

</html>
