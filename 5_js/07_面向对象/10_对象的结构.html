    <script>
        /*
           对象的内存结构 
           1.对象自身
                直接通过对象所添加的属性 位于对象自身中
                在类中通过x=y的形式添加的属性 位于对象自身中
           2.原型对象（prototype）
                对象中还有一些内容 会存储到其他对象中
                对象中会有个属性存储原型对象 叫做__proto__
                原型对象负责为对象存储属性
                访问对象中的属性 先找对象自身
                没有再去原型对象找

                会添加到原型对象中的情况：
                    1.在类中通过xxx(){}方式添加的方法 位于原型中
                    2.主动向原型中添加的属性和方法
        */
        class Person{
            name ="孙悟空"
            age = 18
            // constructor(){
            //     this.gender="男"
            // }
            sayHello(){
                console.log("Hello 我是",this.name);
            }
