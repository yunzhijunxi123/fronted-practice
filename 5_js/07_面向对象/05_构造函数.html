        class Person{
            name
            age
            gender
            //类中添加一个特殊的方法constructor 构造函数 就是为了批量创建并初始化对象
            //调用类 创建对象时 执行
            constructor(name,age,gender){
                //console.log("构造函数执行~",name,age,gender);
                this.name=name//对象的属性=参数
                this.age =age
                this.gender=gender
            }
        }
