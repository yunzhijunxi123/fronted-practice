    <title>Document</title>
    <script>
        let a = 10
        let b = 10n
        console.log(a)
        console.log(b)
        
        // typeof检查类型 检查不同的值的类型
        // 变量没有类型，检查的是变量a存储的值的类型
        console.log(typeof a)//number
        console.log(typeof b)//bigint

    </script>
