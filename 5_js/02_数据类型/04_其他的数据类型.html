<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*布尔值 boolean 1真0假  */
        let bool = true
        bool = false
        let num = 1
        console.log(bool)
        console.log(typeof bool)

        // 空值 null 检查类型为"object" 常用
        let a = null
        console.log(a)
        console.log(typeof a)

        //未定义 Undefined 
        // 声明一个变量没有赋值 值为Undefined
        let b = undefined
        console.log(b)
        console.log(typeof b)

        //符号 Symbol 创建一个唯一的标识

        //Number BigInt String Boolean Null Undefined Symbol
        //七种原始值，创建后不可修改
        let c = Symbol() 
        console.log(c)
    </script>
