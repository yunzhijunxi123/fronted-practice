<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 数值Number 所有整数和浮点数
        // Infinity 特殊数值 表示无穷
        let a = 10;
        a = 10.5;
        a = 3.14;
        a = 0.1 + 0.2;
        a = 1-"a"; //NaN Not a Number
        console.log(a);

        // 大整数 表示比较大的整数 使用n结尾 
        //以内存为基准的无限大 只能表示整数
        a = 99999999999999999999999999999999999n
        
        // 二进制 0b
        // 八进制 0o
        // 十六进制 0x
        a = 0b1010
        a = 0o10
        a = 0xFF
        console.log(a);
    </script>
</head>
<body>
    
</body>
</html>
