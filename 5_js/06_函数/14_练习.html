<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var a = 1//全局变量a
        function fn() {
            a = 2//全局变量
            console.log(a);//2
        }
        fn()
        console.log(a)//2 

        var a = 1//全局变量a
        function fn() {
            console.log(a);//undefined 提升不会去外部再找
            var a = 2//var a提升 a=2留在原地
            console.log(a);//2
        }
        fn()
        console.log(a)//1

        //定义形参 相当于在函数内部声明了变量 但没有赋值
        var a = 1//全局变量a
        function fn(a) {//函数参数a为局部变量
            console.log(a);//undefined 
            a = 2
            console.log(a);//2
        }
        fn()
        console.log(a)//1
        

        var a = 1//全局变量a
        function fn(a) {//函数参数a为局部变量
            console.log(a);//10
            a = 2
            console.log(a);//2
        }
        fn(10)
        console.log(a)//1
       

        var a = 1//全局变量a
        function fn(a) {//形参
            console.log(a);//1
            a = 2
            console.log(a);//2
        }
        fn(a)//实参
        console.log(a)//1
 
        console.log(a)//f a(){alert(2)}
        var a =1//var只负责声明变量
        console.log(a)//1 函数被数值覆盖

        function a(){
            alert(2)
        }
        function a(){
            alert(4)
        }
        console.log(a)//1
        var a = 3
        console.log(a)//3
        var a =function(){
            alert(4)
        }
        console.log(a)//f() {alert(4)} 
        var a
        console.log(a)//f() {alert(4)}

    </script>
</head>

<body>

</body>

</html>
