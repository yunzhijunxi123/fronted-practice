<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*
            变量的提升
            var声明的变量 在所有代码执行前被声明

            函数的提升
            使用函数声明创建的函数
            可在函数声明前调用函数

            let实际也提升 在赋值之前解释器禁止对该变量的访问
        */
        console.log(b)
        let b = 10
        fn()
        function fn() {
            alert("我是fn函数")
        }
        console.log(a)
        var a = 10
        //a=10//window.10
    </script>
</head>

<body>

</body>

</html>
