<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*
           this 函数执行时 
           JS解析器每次都会传递进一个隐含的参数
           这个参数就是this
           this会指向一个对象
           this所指对象根据函数调用方式不同而不同
           
           1.以函数形式调用时 this指向的是window
           2.以方法形式调用时，this指向的是调用方法的的对象

        */
        function fn() {
            //console.log(this===window);//true
            console.log("fn打印", this)
        }
        const obj = { name: "孙悟空" }

        obj.test = fn//把fn函数赋值给obj对象

        const obj2 = { name: "猪八戒", test: fn }
        //window.fn()
        //obj.test()//name:孙悟空
        //obj2.test()//name:猪八戒
        //fn()
        const obj3={
            name:"沙僧",
            sayHello: function(){
                console.log(this.name)//obj3.name
            }}
        const obj4={
            name:"唐僧",
            sayHello:function(){
                console.log(this.name)//obj4.name
            }
        }
        obj3.sayHello()
        obj4.sayHello()
        //为两个对象添加一个方法 可打印自己的名字

    </script>
</head>

<body>

</body>

</html>
