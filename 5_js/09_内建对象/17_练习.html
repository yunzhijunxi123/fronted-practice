<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*
            用自己语言描述
            1 [3-9] 任意数字*9
        */
        let str = "abc13575487862dd14785249647dqa18966557744aa"
        let re = /1[3-9]\d{9}/g //后面的g表示全局匹配
        re = /(1[3-9]\d)\d{4}(\d{4})/g

        
        let result
        while(result = re.exec(str)){//找到匹配，返回数组；没找到匹配，返回null
            //console.log(result[0],result[1],result[2]);//result[1]第一个括号 result[2]第二个括号
            console.log(result[1]+"****"+result[2]);
            
        }

        
    </script>
</head>

</body>

</html>
