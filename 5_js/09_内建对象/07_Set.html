<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*
            Set用来创建一个集合
            功能与数组类似 Set中不能存储重复数据!
        */
        const set = new Set()
        set.add(10)
        set.add("孙悟空")
        
        // for(const item of set){
        //     console.log(item);
        // }

        const arr=[...set]//set转数组

        console.log(arr);
        const arr2=[1,2,2,3,3,3,4,4,4,4]
        const set2 = new Set(arr2)
        console.log([...set2]);//解决数组中重复元素多的问题
        
</script>
</head>

<body>

</body>

</html>
