<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- type为类型,name要与后端对应好,value为默认值-->
    <form action="https://search.jd.com/search">
        <!-- 文本输入框 -->
        账户：<input type="text" name="account" value="zhangsan" maxlength="10"><br>
        <!-- 密码输入框 -->
        密码：<input type="password" name="pwd" value="123" maxlength="6"><br>
        <!-- 单选框 -->
        性别：
        <input type="radio" name="gender" value="male">男
        <input type="radio" name="gender" value="female" checked>女<br>
        <!-- 多选框 -->
        爱好：
        <input type="checkbox" name="hobby" value="smoke" checked>抽烟
        <input type="checkbox" name="hobby" value="drink">喝酒
        <input type="checkbox" name="hobby" value="perm">烫头<br>
        其他：
        <textarea name="other" cols="23" rows="3"></textarea><br>
        籍贯：
        <select name="place">
            <option value="冀"selected>河北</option>
            <option value="鲁" >山东</option>
        </select>
        <!-- 隐藏框 -->
        <input type="hidden" name="tag" value="123">
        <br>
        <!-- 确认按钮不能有name -->
        <!-- <button>确认</button> -->
        <input type="submit" value="确认">
         <!-- 重置按钮 -->
        <!-- <button type="reset">重置</button> -->
        <input type="reset" value="重置">
        <!-- <button type="button">检测账户是否被注册</button> -->
         <input type="button" value="检测账户是否被注册">
    </form>
</body>
</html>
