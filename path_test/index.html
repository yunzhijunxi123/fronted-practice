<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算机科学与技术学院(软件学院、网络安全学院)</title>
    <style>
        /* 重置样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #f5f5f5;
            min-width: 1200px;
        }
        
        /* 顶部导航条 */
        .topbar {
            background-color: #00529B;
            height: 120px;
            position: relative;
            overflow: hidden;
        }
        
        .topbar .container {
            width: 1100px;
            margin: 0 auto;
            position: relative;
            height: 100%;
        }
        
        /* Logo区域 */
        .logo {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
        }
        
        .logo img {
            height: 80px;
            margin-right: 15px;
        }
        
        .logo-text {
            color: white;
            font-size: 24px;
            font-weight: bold;
            line-height: 1.3;
        }
        
        .logo-text .sub {
            font-size: 14px;
            font-weight: normal;
            display: block;
            letter-spacing: 1px;
        }
        
        /* 旧版网站链接 */
        .old-site {
            position: absolute;
            right: 200px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            text-decoration: none;
            font-size: 16px;
        }
        
        /* 搜索框 */
        .search-box {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 220px;
            height: 36px;
            border: 1px solid #D0D0D0;
            background-color: transparent;
            display: flex;
            align-items: center;
        }
        
        .search-box input {
            flex: 1;
            height: 100%;
            border: none;
            background: transparent;
            padding: 0 10px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        
        .search-box button {
            width: 40px;
            height: 100%;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .search-box button img {
            width: 18px;
            height: 18px;
        }
        
        /* 主导航栏 */
        .main-nav {
            background-color: #00529B;
            border-bottom: 2px solid #D4AF37;
            height: 50px;
        }
        
        .main-nav .container {
            width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
        }
        
        .nav-list {
            display: flex;
            list-style: none;
        }
        
        .nav-item {
            position: relative;
        }
        
        .nav-link {
            display: block;
            color: white;
            text-decoration: none;
            padding: 0 20px;
            line-height: 50px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background-color: #003d7a;
        }
        
        /* 下拉菜单 */
        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            background-color: white;
            min-width: 160px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            z-index: 1000;
            display: none;
            border: 1px solid #e0e0e0;
        }
        
        .dropdown-item {
            display: block;
            padding: 10px 20px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        
        .dropdown-item:hover {
            background-color: #f0f0f0;
        }
        
        .nav-item:hover .dropdown {
            display: block;
        }
        
        /* 内容区域 */
        .content {
            min-height: 500px;
            background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)), 
                        url('https://example.com/building-bg.jpg') no-repeat center center;
            background-size: cover;
            padding: 20px;
        }
        
        .banner {
            height: 300px;
            background: url('https://example.com/banner-bg.jpg') no-repeat center center;
            background-size: cover;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #D4AF37;
            font-size: 60px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <!-- 顶部导航条 -->
    <div class="topbar">
        <div class="container">
            <!-- Logo区域 -->
            <div class="logo">
                <img src="https://www.hrbust.edu.cn/_upload/site/00/01/logo.png" alt="哈尔滨理工大学校徽">
                <div class="logo-text">
                    哈尔滨理工大学
                    <span class="sub">计算机科学与技术学院</span>
                    <span class="sub">(软件学院、网络安全学院)</span>
                </div>
            </div>
            
            <!-- 旧版网站链接 -->
            <a href="#" class="old-site">旧版网站</a>
            
            <!-- 搜索框 -->
            <div class="search-box">
                <input type="text" placeholder="请输入关键字">
                <button>
                    <img src="https://cdn-icons-png.flaticon.com/512/107/107613.png" alt="搜索">
                </button>
            </div>
        </div>
    </div>
    
    <!-- 主导航栏 -->
    <div class="main-nav">
        <div class="container">
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="#" class="nav-link">首页</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">学院概况</a>
                    <!-- 下拉菜单 -->
                    <div class="dropdown">
                        <a href="#" class="dropdown-item">学院介绍</a>
                        <a href="#" class="dropdown-item">现任领导</a>
                        <a href="#" class="dropdown-item">委员会</a>
                        <a href="#" class="dropdown-item">学院办公室</a>
                        <a href="#" class="dropdown-item">学生工作办公室</a>
                        <a href="#" class="dropdown-item">系、中心</a>
                    </div>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">师资队伍</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">人才培养</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">学科建设</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">专业建设</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">科学研究</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">党群工作</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">学生工作</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">招生就业</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">校友之家</a>
                </li>
            </ul>
        </div>
    </div>
    
    <!-- 内容区域 -->
    <div class="content">
        <div class="banner">
            五四精神
        </div>
        <!-- 其他内容 -->
        <div style="padding: 20px; background: white; border-radius: 5px;">
            <h2>欢迎来到计算机科学与技术学院</h2>
            这里是学院的主页内容区域。您可以在这里添加课程介绍、新闻公告、学术活动等信息。
        </div>
    </div>
</body>
</html>
