<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>手机电量</span>
    <!-- 正常值20到80绿色，警告值黄色， -->
    <meter max="100" min="0" value="100" low="20" high="80"></meter>
    <!-- 比low低红色，low到high黄色，optimum附近绿色 -->
    <meter max="100" min="0" value="100" low="10" high="20" optimum="90"></meter>
    <hr>
    <span>当前进度
        <progress max="100" value="40"></progress>
    </span>
</body>
</html>
