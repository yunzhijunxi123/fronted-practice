<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 600px;
            height: 200px;
            border: 1px solid black;
            font-size: 20px;
            margin-bottom: 10px;
        }
        .box1{
            background-color: skyblue;
        }
        .box2{
            background-color: green;
        }
    </style>
</head>
<body>
    <div class="box1" contenteditable="true" spellcheck="true">
        Lorem ipsum dolor sit amet.
    </div>
    <!-- hidden隐藏后，不占位 -->
    <div class="box2" draggable="true" hidden data-a="1" data-b="2" data-c="3" ondragend="go(event) ">
        Lorem ipsum dolor sit amet.
    </div>
    <script>
        function go(e){
            alert(e.x)
        }
    </script>
</body>
</html>
