    <form action="" novalidate>

        <!-- url:<input type="url" name="url"> -->
        <!-- step 除以2余数为零 -->
        <!-- 数值：<input type="number" required name="number" step="2" max="80" min="-50"> -->
        <!-- 搜索：<input type="search" required name="keyword"> -->
        <!-- 电话：<input type="tel" required name="tel"> -->
        <!-- 光照强度()：<input type="range" name="range" max="100" min="20" value="22"> -->
        <!-- 颜色：<input type="color" name="color"> -->
        <!-- 日期：<input type="date" required  name="date"> -->
        <!-- 日期：<input type="week" required  name="week"> -->
        日期：<input type="datetime-local" required  name="time2">
