<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <!-- placeholder虚的 用于文字输入类的表单控件-->
        <!-- required,账号必须要填 -->
        <!-- autofocus自动对焦 -->
        <!-- autocomplete用于文本自动完成 -->
        <!-- pattern正则表达式只能是六位 限制不了多行输入 输入不能为空 -->
        账号：<input type="text" name="account" placeholder="请输入账号"  
        required autofocus autocomplete="on" pattern="\w{6}">
        <br>
        密码：<input type="password" name="pwd" placeholder="请输入密码" required>
        <br>
        <!-- 单选 男女二选一即可 -->
        性别：
            <input type="radio" value="male" name="gender" required>男
            <input type="radio" value="female" name="gender">女
        <br>
        <!-- 多选 必须喝酒 -->
            <input type="checkbox" value="smoke" name="hobby" >抽烟
            <input type="checkbox" value="drink" name="hobby" required>喝酒
            <input type="checkbox" value="perm" name="hobby">烫头
        <br>
        其他：<textarea name="other" placeholder="请输入内容" required></textarea>
        <br>
        <button>提交</button>
    </form>
</body>
</html>
