<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- type为类型,name要与后端对应好,value为默认值-->
    <form action="https://search.jd.com/search">
        <!-- 文本输入框 -->
        <label for="zhanghu">账户：</label>
        <input id="zhanghu" type="text" name="account"  maxlength="10" value="zhangsan"><br>
        <!-- 密码输入框 -->
        <label for="mima">密码：</label>
        <input id="mima" type="password" name="pwd" maxlength="6"><br>
        <!-- 单选框 -->
        性别：

        <input id="nan" type="radio" name="gender" value="male">
        <label for="nan">男</label>
        <label>
        <input type="radio" name="gender" value="female" >女<br>    
        </label>
        
        <!-- 多选框 -->
        爱好：
        <label>
            <input type="checkbox" name="hobby" value="smoke" >抽烟
        </label>
        <label>
            <input type="checkbox" name="hobby" value="drink">喝酒
        </label>
        <label>
            <input type="checkbox" name="hobby" value="perm">烫头<br>
        </label>
        <label for="qita"> 其他：</label>
        <textarea id="qita" name="other" cols="23" rows="3"></textarea><br>
        <label>
            籍贯：
            <select name="place">
                <option value="冀">河北</option>
                <option value="鲁" >山东</option>
                <option value="黑">黑龙江</option>
                <option value="吉">吉林</option>
            </select>  
        </label>
        <input type="hidden" name="tag" value="123">
        <br>
        <input type="submit" value="确认">
        <input type="reset" value="重置">
        <input type="button" value="检测账户是否被注册">
    </form>
</body>
</html>
