<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- ol有序列表 -->
    <h2>大象放冰箱需要几步</h2>
    <ol>
        <li>把冰箱门打开</li>
        <li>把大象放进去</li>
        <li>把冰箱门关上</li>
        <li><a href="https://www.baidu.com">去百度</a></li>
    </ol>
    <!-- ul无序列表 -->
    <h2>我想去的哪个城市</h2>
    <ul>
        <li>成都</li>
        <li>
            <span>上海</span>
            <ul>
                <li>外滩</li>
                <li>东方明珠</li>
                <li>迪士尼</li>
            </ul>
        </li>
        <li>南京</li>
        <li>武汉</li>
    </ul>
    <!-- dl描述列表 -->
    <h2>如何更好的学习</h2>
    <dl>
        <dt>做好笔记</dt>
        <dd>笔记仅是复习的抓手</dd>
        <dt>多加练习</dt>
        <dd>只有自己敲的代码才是自己的</dd>
    </dl>
</body>
</html>
