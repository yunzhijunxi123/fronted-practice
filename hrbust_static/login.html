<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计算机科学与技术学院 - 登录/注册</title>
  <link rel="shortcut icon" href="./10035.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-container">
    <!-- 学院标识 -->
    <div class="login-header">
      <!-- <img class="college-icon" src="images/10001.png" alt="校徽"> -->
      <h3>计算机科学与技术学院</h3>
      <p>软件学院 · 网络安全学院</p>
    </div>

    <!-- 表单切换标签 -->
    <div class="form-tabs">
      <span id="loginTab" class="tab active">登 录</span>
      <span id="regTab" class="tab">注 册</span>
    </div>

    <!-- 表单区域 -->
    <div class="form-body">
      <!-- 登录面板 -->
      <form id="loginForm" class="form-panel active">
        <h2>账号登录</h2>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="username" required>
        </div>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-submit">登 录</button>
        <p id="loginMsg" class="msg"></p>
      </form>

      <!-- 注册面板 -->
      <form id="regForm" class="form-panel">
        <h2>注册新账号</h2>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="regUsername" placeholder="设置用户名（至少3位）" autocomplete="off" required>
        </div>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="regPassword" placeholder="设置密码（至少6位）" autocomplete="new-password" required>
        </div>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="regConfirm" placeholder="确认密码" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-submit">注 册</button>
        <p id="regMsg" class="msg"></p>
      </form>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
